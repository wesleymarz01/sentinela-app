<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111418">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Sentinela">
<title>Sentinela</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23111418'/%3E%3Cpath d='M32 12l16 6v12c0 10-7 18-16 22-9-4-16-12-16-22V18z' fill='none' stroke='%2334c38a' stroke-width='5' stroke-linejoin='round'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* =====================================================================
   SENTINELA 2.0 — sistema visual
   Superfícies neutras, cor reservada para estado (ok / atenção / crítico).
   ===================================================================== */
:root{
  --bg:#f3f4f1;--surface:#fff;--surface-2:#f8f9f6;--sunken:#eceee9;
  --line:#e1e4de;--line-strong:#cdd2ca;
  --ink:#13171b;--ink-2:#3a424a;--muted:#67717a;
  --accent:#0d7651;--accent-ink:#fff;--accent-soft:#e2f2ea;
  --ok:#157647;--ok-soft:#e3f2e9;--warn:#a35b00;--warn-soft:#fbefd9;
  --danger:#bf3128;--danger-strong:#bf3128;--danger-soft:#fbe6e3;--info:#2b59c4;--info-soft:#e6edfb;--neutral-soft:#ebede8;
  --side:#0f1215;--side-2:#181c21;--side-ink:#e6e9ec;--side-muted:#7f8891;--side-line:#22272d;
  --shadow:0 1px 2px rgba(16,20,24,.05),0 8px 24px rgba(16,20,24,.06);
  --shadow-lg:0 24px 60px rgba(10,12,15,.22);
  --r:10px;--r-sm:7px;
  --font:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,"Cascadia Mono",Consolas,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0c0f12;--surface:#13171c;--surface-2:#171c22;--sunken:#0e1115;
  --line:#222930;--line-strong:#313941;
  --ink:#e7eaed;--ink-2:#c0c7ce;--muted:#8a949d;
  --accent:#36c48b;--accent-ink:#04140d;--accent-soft:#11302a;
  --ok:#41cf8f;--ok-soft:#0f281e;--warn:#f0b24a;--warn-soft:#2c220e;
  --danger:#ff6a60;--danger-strong:#c9362c;--danger-soft:#331512;--info:#7ba3ff;--info-soft:#141f38;--neutral-soft:#1b2127;
  --side:#0a0c0f;--side-2:#13171b;--side-line:#1c2127;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25);
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#0c0f12;--surface:#13171c;--surface-2:#171c22;--sunken:#0e1115;
  --line:#222930;--line-strong:#313941;
  --ink:#e7eaed;--ink-2:#c0c7ce;--muted:#8a949d;
  --accent:#36c48b;--accent-ink:#04140d;--accent-soft:#11302a;
  --ok:#41cf8f;--ok-soft:#0f281e;--warn:#f0b24a;--warn-soft:#2c220e;
  --danger:#ff6a60;--danger-strong:#c9362c;--danger-soft:#331512;--info:#7ba3ff;--info-soft:#141f38;--neutral-soft:#1b2127;
  --side:#0a0c0f;--side-2:#13171b;--side-line:#1c2127;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25);
  color-scheme:dark;
}

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:14.5px/1.5 var(--font);-webkit-font-smoothing:antialiased}
h1,h2,h3,h4{margin:0;font-weight:600;letter-spacing:-.01em}
p{margin:0}
a{color:var(--accent)}
button{font:inherit;color:inherit}
.hidden{display:none!important}
.muted{color:var(--muted)}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.num{font-variant-numeric:tabular-nums}
.hint{font-size:12.5px;color:var(--muted);line-height:1.45}
.eyebrow{font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.stack{display:grid;gap:16px}.stack-sm{display:grid;gap:8px}
.row-flex{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.spacer{flex:1}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
svg.i{width:18px;height:18px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;vertical-align:-3px}

/* ---------- marca ---------- */
.mark{width:30px;height:30px;border-radius:8px;background:var(--side);display:inline-grid;place-items:center;flex:none;position:relative}
.mark::after{content:"";width:14px;height:16px;border:2.4px solid #34c38a;border-radius:3px 3px 8px 8px;border-top-width:2.4px}
.brandmark{display:flex;align-items:center;gap:11px}
.brandmark b{display:block;font-size:16px;letter-spacing:.02em}
.brandmark small{display:block;color:var(--muted);font-size:12px;line-height:1.3}

/* ---------- botões ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid transparent;border-radius:var(--r-sm);padding:9px 14px;font-weight:600;font-size:14px;line-height:1.2;cursor:pointer;text-decoration:none;white-space:nowrap;transition:background .15s,border-color .15s,color .15s}
.btn.primary{background:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.07)}
.btn.secondary{background:var(--surface);border-color:var(--line-strong);color:var(--ink)}
.btn.secondary:hover{background:var(--surface-2);border-color:var(--muted)}
.btn.ghost{background:transparent;color:var(--ink-2)}
.btn.ghost:hover{background:var(--sunken)}
.btn.danger{background:var(--danger-strong);color:#fff}
.btn.danger-soft{background:var(--danger-soft);color:var(--danger)}
.btn.sm{padding:6px 10px;font-size:13px}
.btn.lg{padding:14px 18px;font-size:15.5px}
.btn.block{width:100%}
.btn:disabled{opacity:.45;cursor:not-allowed;filter:none}
.icon-btn{border:0;background:transparent;width:36px;height:36px;border-radius:8px;display:inline-grid;place-items:center;cursor:pointer;color:var(--ink-2)}
.icon-btn:hover{background:var(--sunken)}
.link{background:none;border:0;padding:0;color:var(--accent);font-weight:600;cursor:pointer;font-size:13.5px}

/* ---------- formulários ---------- */
.field{display:grid;gap:6px;margin:0 0 14px}
.field>label,.label{font-size:12.5px;font-weight:600;color:var(--ink-2)}
input,select,textarea{width:100%;font:inherit;font-size:14.5px;color:var(--ink);background:var(--surface);border:1px solid var(--line-strong);border-radius:var(--r-sm);padding:9px 11px;min-height:40px}
textarea{min-height:92px;resize:vertical;line-height:1.5}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
input[type=checkbox]{width:18px;height:18px;min-height:0;accent-color:var(--accent);margin:0}
.check{display:flex;align-items:center;gap:10px;font-size:14px;cursor:pointer;padding:6px 0}
.grid-2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 14px}
.grid-3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:0 14px}
.filters{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end;margin-bottom:16px}
.filters .field{margin:0;min-width:150px;flex:1 1 150px}
.filters .field.narrow{flex:0 1 190px;min-width:170px}
.weekdays{display:flex;gap:6px;flex-wrap:wrap}
.weekdays label{display:inline-flex;align-items:center;justify-content:center;min-width:42px;height:34px;border:1px solid var(--line-strong);border-radius:var(--r-sm);font-size:13px;font-weight:600;cursor:pointer;user-select:none}
.weekdays input{display:none}
.weekdays input:checked+span{color:var(--accent)}
.weekdays label:has(input:checked){border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}

/* ---------- segmentado ---------- */
.seg{display:inline-flex;background:var(--sunken);border-radius:9px;padding:3px;gap:2px;flex-wrap:wrap}
.seg button{border:0;background:transparent;padding:6px 12px;border-radius:7px;font-weight:600;font-size:13px;color:var(--muted);cursor:pointer;display:inline-flex;gap:6px;align-items:center}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.seg .count{font-family:var(--mono);font-size:11.5px;color:var(--muted)}

/* ---------- estados (pílulas) ---------- */
.pill{display:inline-flex;align-items:center;gap:6px;padding:2px 9px 2px 8px;border-radius:99px;font-size:12px;font-weight:600;white-space:nowrap;background:var(--neutral-soft);color:var(--ink-2);line-height:1.6}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor;opacity:.9}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.danger{background:var(--danger-soft);color:var(--danger)}
.pill.info{background:var(--info-soft);color:var(--info)}
.pill.plain::before{display:none}
.pill.live::before{animation:pulse 1.6s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;background:var(--line-strong);flex:none}
.dot.ok{background:var(--ok)}.dot.warn{background:var(--warn)}.dot.danger{background:var(--danger)}.dot.info{background:var(--info)}

/* ---------- acesso ---------- */
.auth{min-height:100vh;display:grid;place-items:center;padding:24px 16px;background:var(--bg)}
.auth-box{width:100%;max-width:400px}
.auth-box .brandmark{margin-bottom:40px}
.auth-title{font-size:26px;margin-bottom:4px}
.auth-box>section>p.muted{margin-bottom:22px}
.role-list{display:grid;gap:10px}
.role{display:flex;align-items:center;gap:14px;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:16px;cursor:pointer;transition:border-color .15s,box-shadow .15s}
.role:hover{border-color:var(--accent);box-shadow:var(--shadow)}
.role b{display:block;font-size:15px}
.role small{display:block;color:var(--muted);font-size:13px}
.role>span:nth-child(2){flex:1}
.role-ic{width:40px;height:40px;border-radius:9px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center}
.chev{color:var(--muted)}
.link-back{display:inline-flex;gap:6px;align-items:center;border:0;background:none;color:var(--muted);cursor:pointer;padding:0;margin-bottom:18px;font-weight:600}
#loginTitle{margin-bottom:18px}
.divider{display:flex;align-items:center;gap:12px;color:var(--muted);font-size:12px;margin:18px 0}
.divider::before,.divider::after{content:"";flex:1;height:1px;background:var(--line)}
.auth-foot{margin-top:36px;font-size:12px;color:var(--muted)}
#loginNotice{margin:-4px 0 16px}

/* ---------- casca da aplicação ---------- */
.shell{display:grid;grid-template-columns:236px minmax(0,1fr);min-height:100vh}
.side{position:sticky;top:0;height:100vh;background:var(--side);color:var(--side-ink);display:flex;flex-direction:column;padding:18px 12px;gap:22px}
.side .brandmark{padding:2px 8px}
.side .brandmark .mark{background:var(--side-2)}
.side .brandmark small{color:var(--side-muted);max-width:150px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.side-nav{display:grid;gap:2px}
.side-nav .sep{height:1px;background:var(--side-line);margin:10px 8px}
.side-link{display:flex;align-items:center;gap:11px;width:100%;border:0;background:transparent;color:var(--side-muted);padding:9px 10px;border-radius:7px;cursor:pointer;font-weight:500;font-size:14px;text-align:left;position:relative}
.side-link:hover{color:var(--side-ink);background:var(--side-2)}
.side-link[aria-current="page"]{color:var(--side-ink);background:var(--side-2)}
.side-link[aria-current="page"]::before{content:"";position:absolute;left:-12px;top:8px;bottom:8px;width:3px;border-radius:0 3px 3px 0;background:#34c38a}
.side-link .badge{margin-left:auto}
.badge{min-width:20px;height:20px;padding:0 6px;border-radius:99px;background:var(--danger-strong);color:#fff;font:600 11.5px/20px var(--mono);text-align:center}
.badge.warn{background:var(--warn);color:#1a1000}
.side-foot{margin-top:auto;display:grid;gap:2px;border-top:1px solid var(--side-line);padding-top:12px}

.main{min-width:0;display:flex;flex-direction:column}
.topbar{position:sticky;top:0;z-index:20;display:flex;align-items:center;justify-content:space-between;gap:16px;min-height:64px;padding:10px 32px;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.top-l{display:flex;align-items:center;gap:12px;min-width:0}
.top-l h1{font-size:18px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top-sub{font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top-mark{display:none}
.top-r{display:flex;align-items:center;gap:10px;flex:none}
.clock-chip{font-family:var(--mono);font-size:13px;color:var(--ink-2);padding:5px 10px;border:1px solid var(--line);border-radius:7px;background:var(--surface)}
#view{padding:28px 32px 56px;width:100%;max-width:1400px;outline:none}
.demo-strip{display:flex;align-items:center;gap:12px;padding:8px 32px;background:var(--info-soft);color:var(--info);font-size:13px;font-weight:600;border-bottom:1px solid var(--line)}
.demo-strip .btn{margin-left:auto}

.tabbar{display:none;grid-auto-flow:column;grid-auto-columns:1fr;position:fixed;left:0;right:0;bottom:0;z-index:40;background:var(--surface);border-top:1px solid var(--line);padding:6px 4px calc(6px + env(safe-area-inset-bottom))}
.tabbar button{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 2px;color:var(--muted);font-size:11px;font-weight:600;cursor:pointer;position:relative}
.tabbar button .i{width:21px;height:21px}
.tabbar button[aria-current="page"]{color:var(--accent)}
.tabbar .badge{position:absolute;top:0;left:calc(50% + 6px);transform:scale(.85)}
.shell.guard .tabbar{display:grid;left:50%;right:auto;width:min(600px,100%);transform:translateX(-50%)}
@media (min-width:601px){.shell.guard .tabbar{border:1px solid var(--line);border-bottom:0;border-radius:14px 14px 0 0}}
.shell.guard .tabbar button{font-size:12px}

/* relatórios */
.report-layout{display:grid;grid-template-columns:230px minmax(0,1fr);gap:32px;align-items:start}
.rtypes{display:grid;gap:2px;position:sticky;top:84px}
.rtypes button{border:0;background:none;text-align:left;padding:10px 12px;border-radius:8px;cursor:pointer;color:var(--ink-2)}
.rtypes button:hover{background:var(--sunken)}
.rtypes button[aria-current="page"]{background:var(--surface);box-shadow:inset 0 0 0 1px var(--line);color:var(--ink)}
.rtypes button[aria-current="page"] b{color:var(--accent)}
.rtypes b{display:block;font-size:14px;font-weight:600}
.rtypes small{display:block;font-size:12px;color:var(--muted);line-height:1.35;margin-top:1px}
.rtypes-sm{display:none;margin-bottom:16px}
.more-menu{position:fixed;right:12px;bottom:calc(78px + env(safe-area-inset-bottom));z-index:45;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow-lg);padding:6px;min-width:220px}
.more-menu button{display:flex;gap:10px;align-items:center;width:100%;border:0;background:none;padding:11px 12px;border-radius:7px;cursor:pointer;font-weight:500;text-align:left}
.more-menu button:hover{background:var(--sunken)}

/* ---------- blocos de conteúdo ---------- */
.page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:22px}
.page-head h2{font-size:22px}
.page-head p{color:var(--muted);margin-top:2px}
.section{margin-bottom:28px}
.section-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:10px;min-height:32px}
.section-head h3{font-size:15px;display:flex;align-items:center;gap:8px}
.section-head .count{font:500 12.5px var(--mono);color:var(--muted)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
.panel.pad{padding:18px}
.empty{padding:22px 18px;color:var(--muted);font-size:13.5px;text-align:center}
.panel>.empty{padding:28px 18px}
.note{border-left:3px solid var(--line-strong);background:var(--surface-2);padding:10px 14px;border-radius:0 var(--r-sm) var(--r-sm) 0;font-size:13px;color:var(--ink-2)}
.note.warn{border-color:var(--warn);background:var(--warn-soft)}
.note.info{border-color:var(--info);background:var(--info-soft)}
.cols{display:grid;grid-template-columns:minmax(0,1.65fr) minmax(320px,1fr);gap:28px;align-items:start}
.cols-even{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:28px;align-items:start}

/* faixa de indicadores (sem cartões) */
.vitals{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));background:var(--surface);border:1px solid var(--line);border-radius:var(--r);margin-bottom:28px;overflow:hidden}
.vital{padding:16px 18px;border-left:1px solid var(--line);text-align:left;background:none;border-top:0;border-bottom:0;border-right:0;cursor:pointer;color:inherit;font:inherit}
.vital:first-child{border-left:0}
.vital:hover{background:var(--surface-2)}
.vital .k{font-size:12.5px;color:var(--muted);font-weight:500;display:flex;align-items:center;gap:7px}
.vital .v{font:600 28px/1.15 var(--mono);margin-top:6px;letter-spacing:-.03em}
.vital .v small{font-size:15px;color:var(--muted);font-weight:500;letter-spacing:0}
.vital .s{font-size:12px;color:var(--muted);margin-top:2px}
.vital.alert .v{color:var(--danger)}
.vital.caution .v{color:var(--warn)}

/* alerta SOS */
.sos-banner{display:flex;align-items:center;gap:14px;flex-wrap:wrap;background:var(--danger-strong);color:#fff;border-radius:var(--r);padding:14px 18px;margin-bottom:20px;box-shadow:0 8px 28px color-mix(in srgb,var(--danger) 35%,transparent)}
.sos-banner .i{width:24px;height:24px}
.sos-banner b{font-size:15px}
.sos-banner .meta{opacity:.9;font-size:13px}
.sos-banner .acts{margin-left:auto;display:flex;gap:8px}
.sos-banner .btn{background:#fff;color:var(--danger-strong)}
.sos-banner .btn.ghost{background:rgba(255,255,255,.16);color:#fff}
.sos-banner+.sos-banner{margin-top:-10px}

/* ---------- listas ---------- */
.list{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.li{display:grid;grid-template-columns:var(--cols,1fr auto);gap:12px;align-items:center;padding:12px 16px;border-top:1px solid var(--line);text-align:left;width:100%;background:none;border-left:0;border-right:0;border-bottom:0;color:inherit;font:inherit}
.li:first-child{border-top:0}
button.li,.li.click{cursor:pointer}
button.li:hover,.li.click:hover{background:var(--surface-2)}
.li .t{font-weight:600;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.li .d{font-size:12.5px;color:var(--muted);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.li .r{text-align:right;white-space:nowrap}
.li.head{background:var(--surface-2);font-size:11.5px;font-weight:600;color:var(--muted);letter-spacing:.04em;text-transform:uppercase;padding-top:9px;padding-bottom:9px}
.li.crit{box-shadow:inset 3px 0 0 var(--danger)}
.li.caut{box-shadow:inset 3px 0 0 var(--warn)}
.li-ic{width:34px;height:34px;border-radius:8px;display:grid;place-items:center;background:var(--sunken);color:var(--ink-2);flex:none}
.li-ic.danger{background:var(--danger-soft);color:var(--danger)}
.li-ic.warn{background:var(--warn-soft);color:var(--warn)}
.li-ic.ok{background:var(--ok-soft);color:var(--ok)}
.li-ic.info{background:var(--info-soft);color:var(--info)}
.who{display:flex;align-items:center;gap:10px;min-width:0}
.avatar{width:32px;height:32px;border-radius:50%;background:var(--sunken);color:var(--ink-2);display:grid;place-items:center;font-size:12px;font-weight:600;flex:none;letter-spacing:.02em}
.list-foot{padding:10px 16px;border-top:1px solid var(--line);font-size:13px}

/* tabela */
.tbl-wrap{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
table.tbl{width:100%;border-collapse:collapse;font-size:13.5px}
.tbl th{text-align:left;font-size:11.5px;font-weight:600;color:var(--muted);letter-spacing:.04em;text-transform:uppercase;background:var(--surface-2);padding:10px 14px;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl td{padding:11px 14px;border-bottom:1px solid var(--line);vertical-align:middle}
.tbl tbody tr:last-child td{border-bottom:0}
.tbl tbody tr.click{cursor:pointer}
.tbl tbody tr.click:hover td{background:var(--surface-2)}
.tbl td.n,.tbl th.n{text-align:right;font-family:var(--mono);font-variant-numeric:tabular-nums;white-space:nowrap}
.tbl td{white-space:nowrap}
.tbl td.wrap{white-space:normal;min-width:260px;max-width:420px}
.tbl tfoot td{font-weight:600;background:var(--surface-2);border-top:1px solid var(--line)}
.tbl .sub{display:block;font-size:12px;color:var(--muted)}
.delta-late{color:var(--warn);font-weight:600}
.delta-bad{color:var(--danger);font-weight:600}

/* linha do tempo */
.timeline{position:relative;padding-left:4px}
.tl{display:grid;grid-template-columns:54px 14px 1fr;gap:10px;padding:8px 0}
.tl-time{font:500 12.5px var(--mono);color:var(--muted);padding-top:1px;text-align:right}
.tl-mark{position:relative}
.tl-mark::before{content:"";position:absolute;left:6px;top:-10px;bottom:-10px;width:1px;background:var(--line)}
.tl:first-child .tl-mark::before{top:8px}.tl:last-child .tl-mark::before{bottom:calc(100% - 8px)}
.tl-mark i{position:absolute;left:2px;top:5px;width:9px;height:9px;border-radius:50%;background:var(--surface);border:2px solid var(--muted)}
.tl-mark i.ok{border-color:var(--ok);background:var(--ok)}.tl-mark i.warn{border-color:var(--warn)}.tl-mark i.danger{border-color:var(--danger);background:var(--danger)}.tl-mark i.info{border-color:var(--info)}
.tl-body b{font-weight:600;font-size:14px}
.tl-body p{font-size:13.5px;color:var(--ink-2);margin-top:2px;white-space:pre-wrap;word-break:break-word}
.tl-body .d{font-size:12px;color:var(--muted)}

/* fotos */
.thumbs{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.thumbs img{width:76px;height:76px;object-fit:cover;border-radius:7px;border:1px solid var(--line);cursor:zoom-in;background:var(--sunken)}
.photo-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px}
.photo-grid img{width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:8px;border:1px solid var(--line);cursor:zoom-in;background:var(--sunken)}
.preview{display:flex;gap:6px;flex-wrap:wrap}
.preview img{width:64px;height:64px;object-fit:cover;border-radius:7px;border:1px solid var(--line)}

/* chave-valor */
.kv{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px 20px}
.kv div{min-width:0}
.kv dt{font-size:12px;color:var(--muted);margin-bottom:2px}
.kv dd{margin:0;font-weight:500;overflow-wrap:anywhere}
dl{margin:0}

/* mini estatísticas (perfil) */
.mini-stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.mini-stats div{padding:12px 14px;border-left:1px solid var(--line)}
.mini-stats div:first-child{border-left:0}
.mini-stats span{display:block;font-size:12px;color:var(--muted)}
.mini-stats b{font:600 20px/1.3 var(--mono)}

/* ---------- painel lateral ---------- */
.scrim{position:fixed;inset:0;background:rgba(8,10,12,.42);opacity:0;pointer-events:none;transition:opacity .2s;z-index:60}
.scrim.show{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(560px,100%);background:var(--bg);z-index:61;transform:translateX(102%);transition:transform .24s cubic-bezier(.2,.8,.2,1);display:flex;flex-direction:column;box-shadow:var(--shadow-lg);border-left:1px solid var(--line)}
.drawer.show{transform:none}
.drawer-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;padding:20px 22px 16px;border-bottom:1px solid var(--line);background:var(--surface)}
.drawer-head h2{font-size:19px;margin-top:3px}
.drawer-body{overflow-y:auto;padding:20px 22px 40px;display:grid;gap:22px;align-content:start}
.drawer-body h4{font-size:13px;font-weight:600;margin-bottom:10px;color:var(--ink-2)}
.drawer-actions{display:flex;gap:8px;flex-wrap:wrap}

/* ---------- modais ---------- */
.modal{position:fixed;inset:0;background:rgba(8,10,12,.5);display:none;align-items:center;justify-content:center;padding:16px;z-index:80}
.modal.show{display:flex}
.modal-box{width:100%;max-width:460px;max-height:92vh;overflow-y:auto;background:var(--surface);border-radius:14px;padding:22px;box-shadow:var(--shadow-lg);animation:rise .18s ease-out}
.modal-box h3{font-size:18px;margin-bottom:14px}
@keyframes rise{from{transform:translateY(10px);opacity:0}to{transform:none;opacity:1}}
.modal-actions{display:grid;gap:8px;margin-top:6px}
.modal-row{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}
#dlgBody>p{color:var(--ink-2);font-size:14px;margin-bottom:14px;line-height:1.5}
#dlg{z-index:90}

/* checagem com várias fotos */
.modal-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px}
.modal-head h3{margin:0}
.photo-cap{border:1px solid var(--line);border-radius:var(--r);padding:12px;margin:4px 0 14px;background:var(--surface-2)}
.photo-cap-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px}
.photo-count{font:600 12.5px var(--mono);color:var(--muted)}
.photo-count.ok{color:var(--ok)}
.tray{display:flex;gap:12px;overflow-x:auto;padding:10px 10px 4px 2px;scroll-snap-type:x proximity;-webkit-overflow-scrolling:touch}
.tray:empty{display:none}
.tray-item{position:relative;flex:none;width:84px;height:84px;scroll-snap-align:start}
.tray-item img{width:100%;height:100%;object-fit:cover;border-radius:9px;border:1px solid var(--line);background:var(--sunken);cursor:zoom-in;display:block}
.tray-n{position:absolute;left:5px;bottom:5px;min-width:18px;height:18px;padding:0 5px;border-radius:99px;background:rgba(0,0,0,.65);color:#fff;font:600 11px/18px var(--mono);text-align:center;pointer-events:none}
.tray-del{position:absolute;top:-7px;right:-7px;width:28px;height:28px;border-radius:50%;border:2px solid var(--surface);background:var(--danger-strong);color:#fff;display:grid;place-items:center;cursor:pointer;padding:0}
.tray-del .i{width:14px;height:14px;stroke-width:2.6}
.tray-empty{font-size:13px;color:var(--muted);padding:2px 0 4px}
.gps-line{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted);margin:-4px 0 12px}

/* SOS */
.sos-modal .modal-box{border-top:4px solid var(--danger)}
.sos-head{display:flex;align-items:center;gap:10px;color:var(--danger);margin-bottom:10px}
.sos-head h3{margin:0}
.sos-head .i{width:24px;height:24px}
.hold{position:relative;overflow:hidden;width:100%;border:0;border-radius:12px;background:var(--danger-strong);color:#fff;padding:22px 16px;font-weight:700;font-size:17px;letter-spacing:.02em;cursor:pointer;user-select:none;-webkit-user-select:none;touch-action:none;margin:16px 0 10px}
.hold span{position:relative;z-index:1}
.hold::before{content:"";position:absolute;inset:0;background:rgba(0,0,0,.28);transform:scaleX(var(--p,0));transform-origin:left}
.sos-status{display:grid;gap:10px;margin:6px 0 14px}

/* ---------- avisos e utilitários ---------- */
#toasts{position:fixed;right:20px;bottom:20px;display:grid;gap:8px;z-index:100;width:min(420px,calc(100% - 24px));pointer-events:none}
@media (max-width:900px){#toasts{right:auto;bottom:auto;left:50%;top:12px;transform:translateX(-50%)}}
.toast{background:var(--ink);color:var(--bg);padding:11px 14px;border-radius:9px;font-size:13.5px;font-weight:500;box-shadow:var(--shadow-lg);display:flex;gap:10px;align-items:flex-start;transition:opacity .35s,transform .35s;pointer-events:auto}
.toast::before{content:"";width:8px;height:8px;border-radius:50%;margin-top:6px;flex:none;background:var(--ok)}
.toast.warn::before{background:var(--warn)}.toast.err::before{background:var(--danger)}
.toast.out{opacity:0;transform:translateY(-6px)}
.busy{position:fixed;inset:0;background:rgba(8,10,12,.45);display:none;align-items:center;justify-content:center;gap:12px;color:#fff;font-weight:600;z-index:95;flex-direction:column}
.busy.show{display:flex}
.spin{width:34px;height:34px;border-radius:50%;border:3px solid rgba(255,255,255,.3);border-top-color:#fff;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.lightbox{position:fixed;inset:0;background:rgba(0,0,0,.92);display:none;align-items:center;justify-content:center;z-index:99;padding:16px}
.lightbox.show{display:flex}
.lightbox img{max-width:100%;max-height:100%;object-fit:contain;border-radius:6px}
#lbClose{position:absolute;top:14px;right:14px}

/* =====================================================================
   VIGILANTE — leitura rápida, toque grande, uma ação principal por vez
   ===================================================================== */
.shell.guard{grid-template-columns:minmax(0,1fr)}
.shell.guard .side{display:none}
.shell.guard #view{max-width:600px;margin:0 auto;padding:18px 16px 110px}
.shell.guard .topbar{padding:10px 16px}
.shell.guard .top-mark{display:inline-grid}
.shell.guard .demo-strip{padding:8px 16px}
body.guard-mode{font-size:15.5px}
.sos-btn{display:inline-flex;align-items:center;gap:7px;border:0;background:var(--danger-strong);color:#fff;font-weight:700;letter-spacing:.06em;border-radius:99px;padding:9px 16px;cursor:pointer;font-size:14px}
.sos-btn .i{width:17px;height:17px}
.sos-btn.active{animation:sosglow 1.4s infinite}
@keyframes sosglow{0%,100%{box-shadow:0 0 0 0 color-mix(in srgb,var(--danger) 55%,transparent)}50%{box-shadow:0 0 0 8px transparent}}

.duty{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden;margin-bottom:22px}
.duty-top{padding:20px 20px 18px}
.duty-state{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px}
.duty-site{font-size:21px;font-weight:600;letter-spacing:-.015em;line-height:1.25}
.duty-sub{color:var(--muted);font-size:14px;margin-top:3px}
.duty-figs{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));border-top:1px solid var(--line)}
.duty-figs div{padding:14px 20px}
.duty-figs div+div{border-left:1px solid var(--line)}
.duty-figs span{display:block;font-size:12.5px;color:var(--muted)}
.duty-figs b{font:600 24px/1.25 var(--mono);letter-spacing:-.02em}
.duty-act{padding:16px 20px 20px;border-top:1px solid var(--line);display:grid;gap:10px}
.next-check{display:grid;gap:8px}
.next-check .row-flex{justify-content:space-between}
.bar{height:6px;border-radius:99px;background:var(--sunken);overflow:hidden}
.bar span{display:block;height:100%;width:0;background:var(--ok);border-radius:99px;transition:width .6s linear,background .3s}
.quick{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-bottom:24px}
.quick button,.quick a{display:flex;flex-direction:column;align-items:flex-start;gap:10px;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:15px;cursor:pointer;text-align:left;font-weight:600;font-size:14.5px;color:var(--ink);text-decoration:none}
.quick button:hover,.quick a:hover{border-color:var(--line-strong)}
.quick small{display:block;font-weight:400;font-size:12.5px;color:var(--muted);margin-top:1px}
.quick .i{width:22px;height:22px;color:var(--accent)}
.quick button:disabled{opacity:.45;cursor:not-allowed}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.chip{border:1px solid var(--line-strong);background:var(--surface);border-radius:99px;padding:6px 12px;font-size:13px;cursor:pointer;font-weight:500}
.chip:hover{border-color:var(--accent);color:var(--accent)}

/* =====================================================================
   RESPONSIVO
   ===================================================================== */
@media (max-width:1180px){
  .cols{grid-template-columns:minmax(0,1fr)}
  .vitals{grid-template-columns:repeat(3,minmax(0,1fr))}
  .vital:nth-child(4){border-left:0}
  .vital:nth-child(n+4){border-top:1px solid var(--line)}
}
@media (max-width:900px){
  .shell{grid-template-columns:minmax(0,1fr)}
  .side{display:none}
  .top-mark{display:inline-grid}
  .topbar{padding:10px 16px;min-height:58px}
  #view{padding:18px 16px 110px}
  .demo-strip{padding:8px 16px}
  .tabbar{display:grid}
  .report-layout{grid-template-columns:minmax(0,1fr);gap:0}
  .rtypes{display:none}
  .rtypes-sm{display:block}
  .cols-even{grid-template-columns:minmax(0,1fr)}
  .clock-chip{display:none}
  .page-head h2{font-size:20px}
}
@media (max-width:640px){
  .vitals{grid-template-columns:repeat(2,minmax(0,1fr))}
  .vital{padding:13px 14px}
  .vital .v{font-size:23px}
  .vital:nth-child(n){border-left:1px solid var(--line);border-top:1px solid var(--line)}
  .vital:nth-child(odd){border-left:0}
  .vital:nth-child(-n+2){border-top:0}
  .vital:last-child:nth-child(odd){grid-column:span 2}
  .grid-2,.grid-3,.kv{grid-template-columns:minmax(0,1fr)}
  .li{--cols:1fr auto!important;padding:12px 14px}
  .li .hide-sm{display:none}
  .li.head{display:none}
  .mini-stats{grid-template-columns:repeat(2,minmax(0,1fr))}
  .mini-stats div:nth-child(3){border-left:0}
  .mini-stats div:nth-child(n+3){border-top:1px solid var(--line)}
  .modal{align-items:flex-end;padding:0}
  .modal-box{border-radius:16px 16px 0 0;max-height:94vh;padding:20px 18px calc(20px + env(safe-area-inset-bottom))}
  .drawer-head{padding:16px 16px 14px}
  .drawer-body{padding:16px 16px 40px}
  .sos-banner .acts{margin-left:0;width:100%}
  .sos-banner .acts .btn{flex:1}
  .filters .field{flex:1 1 100%}
  .page-head{margin-bottom:16px}
}
@media print{
  .side,.topbar,.tabbar,.demo-strip{display:none!important}
  .shell{display:block}
}

</style>
</head>
<body>

<!-- ===================== ACESSO ===================== -->
<div id="auth" class="auth">
  <div class="auth-box">
    <div class="brandmark"><span class="mark" aria-hidden="true"></span><div><b>Sentinela</b><small>Controle operacional de segurança</small></div></div>

    <section id="gate">
      <h1 class="auth-title">Entrar</h1>
      <p class="muted">Escolha o seu perfil de acesso.</p>
      <div class="role-list">
        <button class="role" onclick="showLogin('guard')">
          <span class="role-ic" data-ic="shield"></span>
          <span><b>Vigilante</b><small>Ponto, plantão, ocorrências e SOS</small></span>
          <span class="chev" data-ic="chevron"></span>
        </button>
        <button class="role" onclick="showLogin('admin')">
          <span class="role-ic" data-ic="grid"></span>
          <span><b>Supervisão</b><small>Operação, equipe, ponto e relatórios</small></span>
          <span class="chev" data-ic="chevron"></span>
        </button>
      </div>
    </section>

    <section id="login" class="hidden">
      <button class="link-back" onclick="backGate()"><span data-ic="back"></span> Voltar</button>
      <h1 class="auth-title" id="loginTitle">Entrar</h1>
      <form id="loginForm" onsubmit="event.preventDefault();loginNow();return false">
        <div class="field"><label for="credential" id="credentialLabel">Código de acesso</label><input id="credential" autocapitalize="off" autocomplete="off"></div>
        <div class="field hidden" id="confirmField"><label for="credentialConfirm">Repita a senha</label><input id="credentialConfirm" type="password" autocomplete="new-password"></div>
        <p class="hint" id="loginNotice"></p>
        <button class="btn primary block lg" type="submit">Entrar</button>
      </form>
      <div class="divider"><span>ou</span></div>
      <button class="btn ghost block" id="demoLoginBtn" onclick="enterDemo()">Ver demonstração</button>
    </section>

    <p class="auth-foot" id="authFoot"></p>
  </div>
</div>

<!-- ===================== APLICAÇÃO ===================== -->
<div id="shell" class="shell hidden">
  <aside class="side" aria-label="Navegação principal">
    <div class="brandmark sm"><span class="mark" aria-hidden="true"></span><div><b>Sentinela</b><small id="sideCompany"></small></div></div>
    <nav id="sideNav" class="side-nav"></nav>
    <div class="side-foot">
      <button class="side-link" onclick="toggleTheme()"><span data-ic="contrast"></span><span>Tema claro/escuro</span></button>
      <button class="side-link" onclick="logout()"><span data-ic="logout"></span><span>Sair</span></button>
    </div>
  </aside>

  <div class="main">
    <header class="topbar">
      <div class="top-l">
        <span class="mark top-mark" aria-hidden="true"></span>
        <div><h1 id="topTitle">Sentinela</h1><div class="top-sub" id="topSub"></div></div>
      </div>
      <div class="top-r" id="topRight"></div>
    </header>
    <div id="demoStrip" class="demo-strip hidden"></div>
    <main id="view" tabindex="-1"></main>
  </div>

  <nav id="tabbar" class="tabbar" aria-label="Navegação"></nav>
  <div id="moreMenu" class="more-menu hidden"></div>
</div>

<!-- Painel lateral de detalhes -->
<div id="scrim" class="scrim" onclick="closeDrawer()"></div>
<aside id="drawer" class="drawer" role="dialog" aria-modal="true" aria-labelledby="drawerTitle">
  <header class="drawer-head"><div><div class="eyebrow" id="drawerKicker"></div><h2 id="drawerTitle"></h2></div><button class="icon-btn" onclick="closeDrawer()" aria-label="Fechar"><span data-ic="x"></span></button></header>
  <div class="drawer-body" id="drawerBody"></div>
</aside>

<!-- Registro com câmera (entrada / checagem / saída). A câmera abre no mesmo toque. -->
<div class="modal" id="captureModal" role="dialog" aria-modal="true" aria-labelledby="captureTitle">
  <div class="modal-box">
    <h3 id="captureTitle">Registrar</h3>
    <div id="entrySiteWrap" class="field hidden">
      <label for="entrySiteSelect">Posto de trabalho</label>
      <select id="entrySiteSelect" onchange="toggleEntryPlaceDetails()"></select>
      <div id="entryPlaceDetails" class="hidden stack-sm">
        <input id="entryPlaceName" placeholder="Nome do posto ou evento" aria-label="Nome do local">
        <input id="entryPlaceAddress" placeholder="Endereço ou referência (opcional)" aria-label="Endereço">
        <p class="hint">A supervisão revisa locais informados manualmente.</p>
      </div>
    </div>
    <div id="checkNoteWrap" class="field hidden"><label for="checkNote">Observação (opcional)</label><textarea id="checkNote" rows="3" placeholder="O que foi verificado, condições do local..."></textarea></div>
    <p class="hint" id="gpsInfo"></p>
    <div class="modal-actions">
      <button class="btn primary block lg" onclick="capture(true)"><span data-ic="camera"></span> Tirar foto com localização</button>
      <button class="btn secondary block" onclick="capture(false)">Tirar foto sem localização</button>
      <button class="btn secondary block hidden" id="skipPhotoBtn" onclick="capture(false,true)">Registrar sem foto</button>
      <button class="btn ghost block" onclick="cancelCapture()">Cancelar</button>
    </div>
  </div>
</div>

<!-- Checagem com várias fotos (rascunho persistente até concluir) -->
<div class="modal" id="checkModal" role="dialog" aria-modal="true" aria-labelledby="checkTitle">
  <div class="modal-box">
    <div class="modal-head"><h3 id="checkTitle">Registrar checagem</h3><button class="icon-btn" onclick="closeCheck()" aria-label="Fechar e continuar depois"><span data-ic="x"></span></button></div>
    <div id="checkBody"></div>
  </div>
</div>

<!-- SOS -->
<div class="modal sos-modal" id="sosModal" role="dialog" aria-modal="true" aria-labelledby="sosTitle">
  <div class="modal-box">
    <div class="sos-head"><span data-ic="siren"></span><h3 id="sosTitle">Emergência</h3></div>
    <div id="sosBody"></div>
  </div>
</div>

<!-- Diálogo genérico -->
<div class="modal" id="dlg" role="dialog" aria-modal="true" aria-labelledby="dlgTitle">
  <div class="modal-box">
    <h3 id="dlgTitle"></h3>
    <div id="dlgBody"></div>
    <div class="modal-row"><button class="btn ghost" id="dlgCancel" onclick="dlgClose(false)">Cancelar</button><button class="btn primary" id="dlgOk" onclick="dlgClose(true)">Confirmar</button></div>
  </div>
</div>

<div class="lightbox" id="lightbox" role="dialog" aria-modal="true" aria-label="Foto ampliada"><button class="btn secondary" id="lbClose" onclick="closeLightbox()">Fechar</button><img id="lbImg" alt=""></div>
<div class="busy" id="busy" role="status" aria-live="polite"><div class="spin"></div><span id="busyMsg">Processando...</span></div>
<div id="toasts" aria-live="polite"></div>
<input id="cameraInput" type="file" accept="image/*" capture="environment" multiple class="hidden">
<input id="checkCameraInput" type="file" accept="image/*" capture="environment" multiple class="hidden">
<input id="importPackageInput" type="file" accept=".json,application/json" class="hidden">
<input id="importBackupInput" type="file" accept=".json,application/json" class="hidden">

<script>
'use strict';
/* =====================================================================
   SENTINELA 2.0 — núcleo
   Utilitários, armazenamento local, fotos, componentes de interface,
   modelo de dados, sessão e navegação.
   Os dados continuam no mesmo armazenamento da V5 (compatível).

/* ---------- fotos em IndexedDB ---------- */
function dataUrlToBlob(u){const [h,b]=u.split(',');const m=/data:([^;]+)/.exec(h)[1];const bin=atob(b);const a=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)a[i]=bin.charCodeAt(i);return new Blob([a],{type:m})}
function blobToDataUrl(b){return new Promise((res,rej)=>{const f=new FileReader();f.onload=()=>res(String(f.result));f.onerror=()=>rej(f.error);f.readAsDataURL(b)})}
async function loadImage(file){
 if(window.createImageBitmap){try{return await createImageBitmap(file,{imageOrientation:'from-image'})}catch(e){}}
 const url=URL.createObjectURL(file);
 try{return await new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=()=>rej(new Error('O navegador não conseguiu abrir a fotografia. Tente JPG ou PNG.'));i.src=url})}
 finally{setTimeout(()=>URL.revokeObjectURL(url),4000)}
}
const Photos=(()=>{
 let dbp=null;const cache=new Map();
 const open=()=>dbp||(dbp=new Promise((res,rej)=>{if(!window.indexedDB)return rej(new Error('IndexedDB indisponível'));const r=indexedDB.open('sentinela_photos',1);r.onupgradeneeded=()=>r.result.createObjectStore('p');r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)}));
 const tx=(mode,fn)=>open().then(d=>new Promise((res,rej)=>{const t=d.transaction('p',mode),rq=fn(t.objectStore('p'));t.oncomplete=()=>res(rq&&rq.result);t.onerror=t.onabort=()=>rej(t.error)}));
 return{
  async put(blob,dataUrl){const id='ph_'+uid();try{await tx('readwrite',s=>s.put(blob,id));return id}catch(e){console.warn('IndexedDB indisponível; foto guardada no registro.',e);return dataUrl}},
  async blob(ref){if(String(ref).startsWith('data:'))return dataUrlToBlob(ref);try{return await tx('readonly',s=>s.get(ref))}catch(e){return null}},
  async url(ref){if(String(ref).startsWith('data:'))return ref;if(cache.has(ref))return cache.get(ref);const b=await this.blob(ref);if(!b)return null;const u=URL.createObjectURL(b);cache.set(ref,u);return u},
  async dataUrl(ref,maxW){
   const b=await this.blob(ref);if(!b)return null;
   if(!maxW)return blobToDataUrl(b);
   const img=await loadImage(b),iw=img.naturalWidth||img.width,ih=img.naturalHeight||img.height,r=Math.min(1,maxW/Math.max(iw,ih));
   const c=document.createElement('canvas');c.width=Math.max(1,Math.round(iw*r));c.height=Math.max(1,Math.round(ih*r));c.getContext('2d').drawImage(img,0,0,c.width,c.height);return c.toDataURL('image/jpeg',.7);
  },
  async del(ref){if(String(ref).startsWith('data:'))return;try{await tx('readwrite',s=>s.delete(ref))}catch(e){}cache.delete(ref)}
 };
})();

new MutationObserver(()=>{cancelAnimationFrame(hydrate._t);hydrate._t=requestAnimationFrame(()=>{hydrate();paintIcons()})}).observe(document.documentElement,{childList:true,subtree:true});

async function hashBytes(blob){try{if(window.crypto?.subtle){const d=await crypto.subtle.digest('SHA-256',await blob.arrayBuffer());return [...new Uint8Array(d)].map(b=>b.toString(16).padStart(2,'0')).join('')}}catch(e){}return null}
/* Reduz a foto, carimba data/hora/GPS na imagem, calcula hash de integridade e guarda. */
async function processPhoto(file,lines=[]){
 if(!file||!(String(file.type||'').startsWith('image/')||/\.(jpe?g|png|webp|heic)$/i.test(file.name||'')))throw new Error('O arquivo selecionado não é uma imagem.');
 const img=await loadImage(file),iw=img.naturalWidth||img.width,ih=img.naturalHeight||img.height,r=Math.min(1,1280/Math.max(iw,ih));
 const c=document.createElement('canvas');c.width=Math.max(1,Math.round(iw*r));c.height=Math.max(1,Math.round(ih*r));
 const x=c.getContext('2d');if(!x)throw new Error('Não foi possível preparar a fotografia neste aparelho.');
 x.drawImage(img,0,0,c.width,c.height);
 if(lines.length){const fs=Math.max(12,Math.round(c.width/46)),p=Math.round(fs*.6),bh=Math.round(lines.length*fs*1.3+p*2);x.fillStyle='rgba(0,0,0,.62)';x.fillRect(0,c.height-bh,c.width,bh);x.fillStyle='#fff';x.font=`600 ${fs}px Arial,sans-serif`;x.textBaseline='top';lines.forEach((t,i)=>x.fillText(t,p,c.height-bh+p+i*fs*1.3,c.width-p*2))}
 const dataUrl=c.toDataURL('image/jpeg',.74);
 if(!dataUrl||dataUrl==='data:,')throw new Error('A fotografia ficou vazia durante o processamento.');
 const blob=dataUrlToBlob(dataUrl);
 return{ref:await Photos.put(blob,dataUrl),hash:await hashBytes(blob)};
}

function fieldHtml(f){
 const id='dlgf_'+f.id,v=f.value??'';let ctl;
 if(f.type==='textarea')ctl=`<textarea id="${id}" rows="${f.rows||4}" placeholder="${esc(f.placeholder||'')}">${esc(v)}</textarea>`;
 else if(f.type==='select')ctl=`<select id="${id}">${(f.options||[]).map(([val,l])=>`<option value="${esc(val)}" ${String(val)===String(v)?'selected':''}>${esc(l)}</option>`).join('')}</select>`;
 else if(f.type==='checkbox')return `<label class="check" id="wrap_${id}"><input type="checkbox" id="${id}" ${v?'checked':''}><span>${esc(f.label)}</span></label>`;
 else if(f.type==='weekdays')ctl=`<div class="weekdays" id="${id}">${WEEKDAYS.map((d,i)=>`<label><input type="checkbox" value="${i}" ${(v||[]).map(Number).includes(i)?'checked':''}><span>${d}</span></label>`).join('')}</div>`;
 else ctl=`<input id="${id}" type="${f.type||'text'}" value="${esc(v)}" placeholder="${esc(f.placeholder||'')}" ${f.type==='password'?'autocomplete="off"':''} ${f.min!==undefined?`min="${esc(f.min)}"`:''}>`;
 return `<div class="field" id="wrap_${id}"><label for="${id}">${esc(f.label)}</label>${ctl}${f.hint?`<span class="hint">${esc(f.hint)}</span>`:''}</div>`;

function dialog(o){

  if(dlgResolve)dlgClose(false);
  dlgReturn=document.activeElement;dlgResolve=resolve;dlgFields=o.fields||[];
  $('dlgTitle').textContent=o.title||'';
  $('dlgBody').innerHTML=(o.body?`<p>${o.body}</p>`:'')+dlgFields.map(f=>f.row?`<div class="grid-2">${f.row.map(fieldHtml).join('')}</div>`:fieldHtml(f)).join('');

  $('dlg').classList.add('show');o.onRender?.($('dlgBody'));
  setTimeout(()=>(qs('#dlgBody input:not([type=checkbox]),#dlgBody textarea,#dlgBody select')||$('dlgOk')).focus(),30);
 });

function dlgClose(ok){
 if(!dlgResolve)return;let res=null;
 if(ok){res={};for(const f of flatFields(dlgFields)){const el=$('dlgf_'+f.id);let v;
   if(f.type==='checkbox')v=!!el?.checked;
   else if(f.type==='weekdays')v=[...(el?.querySelectorAll('input:checked')||[])].map(i=>Number(i.value));
   else v=el?(f.type==='password'?el.value:el.value.trim()):'';
   const hidden=$('wrap_dlgf_'+f.id)?.classList.contains('hidden');
   if(!hidden&&f.required&&!v){el?.focus();return toast('Preencha: '+f.label,'warn')}
   if(!hidden&&f.validate){const err=f.validate(v,res);if(err){el?.focus?.();return toast(err,'warn')}}
   res[f.id]=v}}
 $('dlg').classList.remove('show');const r=dlgResolve;dlgResolve=null;r(res);
 try{dlgReturn?.focus()}catch(e){}
}

const emptyDb=()=>({v:6,company:'Minha Empresa',supervisorPhone:'',lateTolerance:10,adminAuth:null,guards:[],sites:[],rules:{},shifts:[],records:[],occurrences:[],audit:[],pointAdjustments:[],extraRequests:[],acks:{}});
function migrate(raw){
 const d=Object.assign(emptyDb(),raw&&typeof raw==='object'?raw:{});
 ['guards','sites','shifts','records','occurrences','audit','pointAdjustments','extraRequests'].forEach(k=>{if(!Array.isArray(d[k]))d[k]=[]});
 if(!d.rules||typeof d.rules!=='object')d.rules={};if(!d.acks||typeof d.acks!=='object')d.acks={};
 if(!Number.isFinite(Number(d.lateTolerance)))d.lateTolerance=10;
 // v4 guardava um único plantão global em db.shift
 if(d.shift){const i=d.shifts.findIndex(x=>sameId(x.id,d.shift.id));if(i<0)d.shifts.push(d.shift);else d.shifts[i]=Object.assign({},d.shifts[i],d.shift);delete d.shift}
 const gByName=new Map(d.guards.map(g=>[g.name,g]));
 d.guards.forEach(g=>{
  if(g.active===undefined)g.active=true;
  if(!Array.isArray(g.scheduleDays))g.scheduleDays=[0,1,2,3,4,5,6];

function cyrb53(s,seed=0){let h1=0xdeadbeef^seed,h2=0x41c6ce57^seed;for(let i=0;i<s.length;i++){const c=s.charCodeAt(i);h1=Math.imul(h1^c,2654435761);h2=Math.imul(h2^c,1597334677)}h1=Math.imul(h1^(h1>>>16),2246822507)^Math.imul(h2^(h2>>>13),3266489909);h2=Math.imul(h2^(h2>>>16),2246822507)^Math.imul(h1^(h1>>>13),3266489909);return 4294967296*(2097151&h2)+(h1>>>0)}
async function hashPw(pw,salt){

}

/* =====================================================================
   OPERAÇÃO — escala, presença, atrasos, faltas, checagens, alertas
   e acompanhamento de ocorrências. Tudo calculado a partir dos dados.
   ===================================================================== */
const tolMin=()=>Math.max(0,Number(db.lateTolerance)||0);
const isScheduled=g=>g?.scheduleMode==='scheduled';

/* ---------- ajustes de ponto (o original nunca é apagado) ---------- */
const adjustmentsFor=r=>db.pointAdjustments.filter(a=>sameId(a.recordId,r?.id)).sort(byOldest);
const adjustmentFor=r=>{const l=adjustmentsFor(r);return l[l.length-1]||null};
const effAt=r=>r?Date.parse(adjustmentFor(r)?.adjustedAt||r.createdAt):null;
const entryOf=sh=>shiftRecords(sh).find(r=>r.type==='Entrada')||null;
const exitOf=sh=>[...shiftRecords(sh)].reverse().find(r=>r.type==='Saída')||null;
const shiftStart=sh=>{const e=entryOf(sh);return e?effAt(e):Date.parse(sh.startedAt)};
const shiftEnd=sh=>{const x=exitOf(sh);return x?effAt(x):(sh.closedAt?Date.parse(sh.closedAt):null)};

/* ---------- escala ---------- */
function expectedOn(g,key){
 if(!isScheduled(g)||g.active===false)return false;
 if(g.temporary&&g.expiresAt&&g.expiresAt<key)return false;
 if(g.scheduleSince&&key<g.scheduleSince)return false;   // não cobra dias anteriores ao cadastro da escala
 if(g.scheduleCycle==='12x36'){
  const anchor=g.scheduleAnchor||key,diff=Math.round((keyToDate(key)-keyToDate(anchor))/864e5);
  return ((diff%2)+2)%2===0;
 }
 return (g.scheduleDays||[0,1,2,3,4,5,6]).map(Number).includes(keyToDate(key).getDay());
}
function planFor(g,key){
 const [sh,sm]=(g.scheduleStart||'18:00').split(':').map(Number),[eh,em]=(g.scheduleEnd||'06:00').split(':').map(Number);
 const s=keyToDate(key);s.setHours(sh,sm,0,0);const e=keyToDate(key);e.setHours(eh,em,0,0);
 let end=e.getTime();if(end<=s.getTime())end+=864e5;
 return{start:s.getTime(),end};
}
const scheduleText=g=>{
 if(!isScheduled(g))return 'Jornada flexível';
 const days=g.scheduleCycle==='12x36'?'12x36':((g.scheduleDays||[]).length===7?'Todos os dias':(g.scheduleDays||[]).slice().sort().map(d=>WEEKDAYS[d]).join(', ')||'Sem dias');
 return `${g.scheduleStart||'18:00'}–${g.scheduleEnd||'06:00'} · ${days}`;
};
/* Plantão do vigilante que corresponde à janela prevista (aceita chegada até 4h antes). */
function shiftForPlan(g,plan){
 return db.shifts.filter(s=>shiftOfGuard(s,g)).map(s=>({s,a:shiftStart(s)})).filter(x=>x.a>=plan.start-4*36e5&&x.a<plan.end).sort((x,y)=>x.a-y.a)[0]?.s||null;
}
/* Situação da escala de um dia: previsto, atrasado (sem entrada), em serviço, concluído, incompleto ou falta. */
function attendance(g,key,now=Date.now()){
 if(!expectedOn(g,key))return null;
 const plan=planFor(g,key),sh=shiftForPlan(g,plan),tol=tolMin()*60000;
 if(sh){
  const a=shiftStart(sh),delay=Math.round((a-plan.start)/60000);
  const status=!sh.closed?'servico':(entryOf(sh)&&exitOf(sh)?'concluido':'incompleto');
  return{key,plan,shift:sh,status,delayMin:delay,late:delay*60000>tol};
 }
 if(now<plan.start+tol)return{key,plan,shift:null,status:'previsto'};
 if(now<plan.end)return{key,plan,shift:null,status:'atrasado',lateMin:Math.round((now-plan.start)/60000)};
 return{key,plan,shift:null,status:'falta'};
}
/* Janela relevante agora: a de ontem se ainda não terminou (plantão noturno), senão a de hoje. */
function currentAttendance(g,now=Date.now()){
 const t=todayKey(),y=addDays(t,-1),ay=attendance(g,y,now);
 if(ay&&(ay.plan.end>now||ay.status==='servico'))return ay;
 return attendance(g,t,now)||(ay&&ay.status==='falta'&&ay.plan.end>now-24*36e5?ay:null);
}

/* ---------- checagens ---------- */
function checkState(sh,now=Date.now()){
 const rule=ruleOf(sh.siteId),iv=Number(rule?.interval||0),gr=Number(rule?.grace||0);
 if(!iv)return{iv:0,rule};
 const base=lastCheckMs(sh),due=base+iv*60000,limit=due+gr*60000;
 return{iv,gr,rule,base,due,limit,left:due-now,late:now>limit,lateMin:Math.max(0,Math.round((now-limit)/60000)),progress:Math.min(1,Math.max(0,(now-base)/(iv*60000)))};
}
function expectedChecks(sh){const iv=Number(ruleOf(sh.siteId)?.interval||0);if(!iv)return 0;const end=sh.closedAt?Date.parse(sh.closedAt):Date.now();return Math.floor((end-Date.parse(sh.startedAt))/(iv*60000))}
const checksOf=sh=>shiftRecords(sh).filter(r=>r.type==='Checagem');

/* ---------- ocorrências: situação e acompanhamento ---------- */
const OCC_STATUS={nova:'Nova',andamento:'Em andamento',resolvida:'Resolvida',info:'Informativo'};
const SOS_STATUS={nova:'Aberto',andamento:'Em atendimento',resolvida:'Encerrado'};
const occLabel=o=>(o.type==='SOS'?SOS_STATUS:OCC_STATUS)[o.status]||o.status;
const occTone=o=>o.status==='nova'?(o.type==='SOS'?'danger':'warn'):o.status==='andamento'?'info':o.status==='resolvida'?'ok':'';
const occPill=o=>`<span class="pill ${occTone(o)}">${esc(occLabel(o))}</span>`;
const openSos=()=>db.occurrences.filter(o=>o.type==='SOS'&&o.status==='nova').sort(byNewest);
const openOccCount=()=>db.occurrences.filter(o=>o.status==='nova').length;
function setOccStatus(id,status,note,action){
 const o=occById(id);if(!o)return false;
 const prev=o.status,L=o.type==='SOS'?SOS_STATUS:OCC_STATUS;o.status=status;
 o.history.push({at:new Date().toISOString(),by:mode==='admin'?'Supervisão':(user?.name||'Sistema'),action:action||`${L[prev]||OCC_STATUS[prev]||prev} → ${L[status]}`,note:note||''});
 if(o.type==='SOS'&&status!=='nova')db.acks['sos-'+o.id]=db.acks['sos-'+o.id]||{at:new Date().toISOString(),by:'Supervisão'};
 audit(o.type==='SOS'?'SOS: '+(SOS_STATUS[status]||status):'Ocorrência: '+OCC_STATUS[status],{guardName:o.guardName,siteName:o.siteName,reason:note||''});
 return true;
}

/* ---------- quadro da equipe ---------- */
/* Uma linha por vigilante ativo, ordenada pela urgência. */
function teamBoard(now=Date.now()){
 const sosBy=new Set(openSos().map(o=>String(o.guardId)));
 return db.guards.filter(g=>g.active!==false).map(g=>{
  const sh=activeShifts().find(s=>shiftOfGuard(s,g)),att=currentAttendance(g,now);
  let st,tone,rank,note='';
  if(sosBy.has(String(g.id))){st='SOS';tone='danger';rank=0}
  if(sh){
   const c=checkState(sh,now);
   if(!st){if(c.late){st='Checagem atrasada';tone='danger';rank=1}else{st='Em serviço';tone='ok';rank=4}}
   if(att?.shift&&sameId(att.shift.id,sh.id)&&att.late)note=`Entrada com ${att.delayMin} min de atraso`;
   return{g,sh,att,check:c,st,tone,rank,note};
  }
  if(!st&&att){
   if(att.status==='atrasado'){st='Sem entrada';tone='warn';rank=2;note=`Previsto ${fmtT(att.plan.start)} · há ${fmtAgo(now-att.plan.start)}`}
   else if(att.status==='falta'){st='Falta';tone='danger';rank=3;note=`Previsto ${fmtT(att.plan.start)}–${fmtT(att.plan.end)}`}
   else if(att.status==='previsto'){st='Previsto';tone='';rank=5;note=`Entrada às ${fmtT(att.plan.start)}`}
   else{st=att.status==='incompleto'?'Plantão incompleto':'Encerrado';tone=att.status==='incompleto'?'warn':'';rank=att.status==='incompleto'?3:6;note=att.shift?.closedAt?'Saída '+fmtT(att.shift.closedAt):''}
  }
  if(!st){const last=myLastShift(g);st='Sem escala hoje';tone='';rank=9;note=last?`Último plantão ${fmtDShort(last.startedAt)}`:'Sem plantões'}
  return{g,sh:null,att,st,tone,rank,note};
 }).sort((a,b)=>a.rank-b.rank||a.g.name.localeCompare(b.g.name));
}
const myLastShift=g=>db.shifts.filter(s=>shiftOfGuard(s,g)).sort((a,b)=>(b.startedAt||'').localeCompare(a.startedAt||''))[0]||null;

function getAlerts(now=Date.now()){
 const out=[];
 openSos().forEach(o=>out.push({key:'sos-'+o.id,kind:'SOS',sev:'danger',title:`SOS — ${o.guardName}`,detail:`${o.siteName||'Local não informado'}${o.location?' · com localização':''}`,time:fmtT(o.createdAt),guardId:o.guardId,act:{label:'Abrir',act:'openOcc',id:o.id}}));
 activeShifts().forEach(sh=>{
  const c=checkState(sh,now);
  if(c.late)out.push({key:'late-'+sh.id+'-'+c.base,kind:'Checagem',sev:'danger',title:`Checagem atrasada — ${sh.guardName}`,detail:`${sh.siteName} · vencida há ${fmtAgo(now-c.limit)}`,time:fmtT(c.limit),guardId:sh.guardId,act:{label:'Plantão',act:'openShift',id:sh.id}});
  if(now-Date.parse(sh.startedAt)>14*36e5)out.push({key:'long-'+sh.id,kind:'Plantão longo',sev:'warn',title:`Plantão aberto há ${fmtMs(now-Date.parse(sh.startedAt))} h — ${sh.guardName}`,detail:sh.siteName,time:fmtT(sh.startedAt),guardId:sh.guardId,act:{label:'Plantão',act:'openShift',id:sh.id}});
 });
 db.guards.filter(g=>g.active!==false).forEach(g=>{
  if(activeShifts().some(s=>shiftOfGuard(s,g)))return;
  const a=currentAttendance(g,now);
  if(a?.status==='atrasado')out.push({key:'abs-'+g.id+'-'+a.key,kind:'Sem entrada',sev:'warn',title:`${g.name} não registrou entrada`,detail:`Previsto ${fmtT(a.plan.start)} · atraso de ${fmtAgo(now-a.plan.start)}`,time:fmtT(a.plan.start),guardId:g.id,act:{label:'Vigilante',act:'openGuard',id:g.id}});
  if(a?.status==='falta')out.push({key:'falta-'+g.id+'-'+a.key,kind:'Falta',sev:'warn',title:`Falta — ${g.name}`,detail:`Escala ${fmtT(a.plan.start)}–${fmtT(a.plan.end)} sem registro`,time:fmtDShort(a.plan.start),guardId:g.id,act:{label:'Vigilante',act:'openGuard',id:g.id}});
 });
 const newOcc=db.occurrences.filter(o=>o.status==='nova'&&o.type!=='SOS');
 if(newOcc.length)out.push({key:'occ-new',kind:'Ocorrências',sev:'warn',title:newOcc.length===1?'1 ocorrência aguardando análise':`${newOcc.length} ocorrências aguardando análise`,detail:firstLine(newOcc.sort(byNewest)[0].text),time:fmtT(newOcc[0].createdAt),act:{label:'Ver',act:'goOcc'}});
 const review=db.sites.filter(s=>s.needsReview);
 review.forEach(s=>out.push({key:'site-'+s.id,kind:'Local',sev:'info',title:`Local informado pelo vigilante: ${s.name}`,detail:'Confirme nome e endereço do posto',time:'',act:{label:'Revisar',act:'editSite',id:s.id}}));
 const extras=db.extraRequests.filter(x=>x.status==='Pendente');
 if(extras.length)out.push({key:'extra',kind:'Extra',sev:'info',title:extras.length===1?'1 plantão extra aguardando aprovação':`${extras.length} plantões extras aguardando aprovação`,detail:extras.map(x=>x.guardName).join(', '),time:'',act:{label:'Analisar',act:'goExtras'}});
 const w={danger:0,warn:1,info:2};
 return out.sort((a,b)=>w[a.sev]-w[b.sev]);
}

function toggleEntryPlaceDetails(){const v=$('entrySiteSelect')?.value||'';$('entryPlaceDetails').classList.toggle('hidden',!(v==='__other__'||v==='__event__'));$('entryPlaceName').placeholder=v==='__event__'?'Nome do evento':'Nome do posto'}

function cancelCapture(){pending=null;$('captureModal').classList.remove('show')}
function getGps(timeout=15000,quiet=false){
 return new Promise(resolve=>{
  const warn=m=>{if(!quiet)toast(m,'warn',6500)};
  if(!window.isSecureContext||!navigator.geolocation){warn('O navegador não liberou a localização neste endereço. Abra por HTTPS (ou localhost) e autorize.');return resolve(null)}
  navigator.geolocation.getCurrentPosition(
   p=>resolve({lat:+p.coords.latitude.toFixed(6),lon:+p.coords.longitude.toFixed(6),accuracy:Math.round(p.coords.accuracy)}),
   e=>{warn(e.code===1?'Permissão de localização negada.':e.code===2?'Não foi possível determinar a posição. Verifique o GPS.':'Tempo esgotado ao obter a localização.');resolve(null)},
   {enableHighAccuracy:true,timeout,maximumAge:0});
 });
}
const stampLines=(site,loc)=>[`${new Date().toLocaleString('pt-BR')} • ${user?.name||''} • ${site||''}`,loc?`GPS ${loc.lat}, ${loc.lon} (±${loc.accuracy} m)`:'GPS não registrado'];
function readEntryPlace(){
 const v=$('entrySiteSelect').value,known=siteById(v);
 if(known)return{siteId:known.id,siteName:known.name,siteAddress:known.address||'',placeType:'Posto'};
 const kind=v==='__event__'?'Evento':'Outro';
 return{siteId:null,siteName:$('entryPlaceName').value.trim()||kind,siteAddress:$('entryPlaceAddress').value.trim(),placeType:kind};
}
/* A câmera é aberta de forma síncrona ao toque (iOS/Android bloqueiam se não for); o GPS corre em paralelo. */
function capture(gps,skipPhoto){
 if(!pending)return;
 if(pending.type==='Entrada'){pending.entryPlace=readEntryPlace();if(pending.entryPlace.placeType!=='Posto'&&!$('entryPlaceName').value.trim())return toast('Informe o nome do local.','warn')}
 if(pending.type==='Checagem')pending.text=$('checkNote').value.trim();
 $('captureModal').classList.remove('show');
 if(skipPhoto){
  const sh=myActiveShift(),need=!!(sh&&ruleOf(sh.siteId)?.gps);busy(true,'Registrando...');
  (need?getGps():Promise.resolve(null)).then(loc=>finalizePoint([],loc)).finally(()=>busy(false));return;
 }
 gpsPromise=gps?getGps():Promise.resolve(null);
 const ci=$('cameraInput');ci.value='';ci.click();
}
$('cameraInput').addEventListener('cancel',()=>{pending=null;toast('Registro cancelado: nenhuma foto foi selecionada.','warn')});
$('cameraInput').addEventListener('change',async e=>{
 const input=e.currentTarget,files=[...input.files||[]];
 if(!files.length){pending=null;return}
 const p=pending;if(!p)return;
 busy(true,'Obtendo localização e processando fotos...');
 try{
  const loc=await gpsPromise;syncFromStorage();
  const site=p.type==='Entrada'?p.entryPlace.siteName:myActiveShift()?.siteName,photos=[];
  for(const f of files)photos.push(await processPhoto(f,stampLines(site,loc)));
  await finalizePoint(photos,loc);
 }catch(err){console.error(err);pending=null;toast('Não foi possível processar a fotografia: '+(err?.message||'erro desconhecido'),'err',8000)}
 finally{busy(false);input.value=''}
});
async function finalizePoint(photos,loc){
 const p=pending;pending=null;if(!p)return;syncFromStorage();
 let sh=myActiveShift();const d=new Date();
 if(p.type==='Entrada'){
  if(sh)return toast('Você já está em plantão.','warn');
  const pl=p.entryPlace;let s=pl.siteId?siteById(pl.siteId):null;
  if(!s){
   s=db.sites.find(x=>x.temporaryPlace&&x.name.toLowerCase()===pl.siteName.toLowerCase());
   if(!s){s={id:uid(),name:pl.siteName,address:pl.siteAddress,temporaryPlace:true,placeType:pl.placeType,needsReview:true};db.sites.push(s);audit('Local informado pelo vigilante — aguardando revisão',{guardName:user.name,siteName:s.name,reason:s.placeType})}
  }
  sh={id:uid(),guardId:user.id,guardName:user.name,siteId:s.id,siteName:s.name,siteAddress:s.address||'',placeType:s.placeType||'Posto',placeNeedsReview:!!s.needsReview,companyName:db.company,startedAt:d.toISOString(),closed:false,draft:'',events:[]};
  db.shifts.push(sh);
 }
 if(!sh)return toast('Não há plantão ativo.','warn');
 const site=siteById(sh.siteId)||{},rule=ruleOf(sh.siteId);
 const r={id:uid(),shiftId:sh.id,guardId:user.id,type:p.type,guardName:user.name,siteId:sh.siteId,siteName:sh.siteName,siteAddress:sh.siteAddress||site.address||'',companyName:db.company,time:d.toLocaleTimeString('pt-BR'),date:d.toLocaleDateString('pt-BR'),createdAt:d.toISOString(),photos:photos.map(x=>x.ref),photoMeta:photos.map(x=>({hash:x.hash||null,...(x.capturedAt?{capturedAt:x.capturedAt}:{})})),location:loc||null,text:p.text||'',gpsRequired:!!p.gpsRequired};
 if(p.type==='Checagem'&&Number(rule?.interval)>0){
  const gap=d.getTime()-lastCheckMs(sh),limit=(Number(rule.interval)+Number(rule.grace||0))*60000;
  if(gap>limit){r.late=true;r.delayMin=Math.round((gap-Number(rule.interval)*60000)/60000)}
 }
 db.records.push(r);sh.events.push(r.id);
 if(p.type==='Saída'){sh.closed=true;sh.closedAt=d.toISOString();sh.status='Encerrado';audit('Plantão encerrado',{guardName:sh.guardName,siteName:sh.siteName,shiftId:sh.id})}
 persist();
 toast(`${p.type} registrada${photos.length?' com '+photos.length+' foto(s)':' sem foto'}${loc?' e localização':' (sem localização)'}${r.late?' — fora do prazo':''}.`,r.late?'warn':'ok');
 if(p.type==='Saída'){tab('ghist');toast('Plantão encerrado. Envie o relatório à supervisão em “Meus plantões”.','ok',7000)}
 return r;
}

/* ---------- checagem com várias fotos ----------
   A checagem fica num RASCUNHO até o vigilante concluir:
   - cada foto é processada (carimbo + hash) e gravada no IndexedDB assim que sai da câmera;
   - o rascunho (texto + referências das fotos) fica no localStorage, por vigilante e plantão;
   - fechar o modal, trocar de tela, minimizar ou o Android fechar o app não perde as fotos;
   - ao concluir, as fotos viram anexos de UM registro de checagem (sem duplicar);
   - fotos excluídas da bandeja são apagadas do aparelho e não entram no registro. */
const checkDraftKey=()=>`sentinela_check_draft_${demoMode?'demo':'real'}_${user?.id}`;
const checkGps={promise:null,loc:null,status:'idle',at:0};
function readCheckDraft(){try{return JSON.parse(lsGet(checkDraftKey())||'null')}catch(e){return null}}
function getCheckDraft(){
 if(mode!=='guard'||!user)return null;
 const d=readCheckDraft();if(!d)return null;
 const sh=myActiveShift();
 if(sh&&sameId(d.shiftId,sh.id))return d;
 if(!sh&&!db.shifts.length)return null;   // dados ainda não carregados: não descarta nada
 dropCheckDraft(d);return null;           // plantão encerrado: rascunho órfão é descartado
}
function saveCheckDraft(d){lsSet(checkDraftKey(),JSON.stringify(d))}
function dropCheckDraft(d,deletePhotos=true){
 if(deletePhotos)(d?.photos||[]).forEach(p=>Photos.del(p.ref));
 try{localStorage.removeItem(checkDraftKey())}catch(e){}delete mem[checkDraftKey()];
}
function startCheckGps(force){
 if(checkGps.status==='busy')return checkGps.promise;
 if(!force&&checkGps.status==='ok'&&Date.now()-checkGps.at<120000)return Promise.resolve(checkGps.loc);
 checkGps.status='busy';renderCheckGps();
 checkGps.promise=getGps(15000,true).then(loc=>{checkGps.loc=loc;checkGps.status=loc?'ok':'fail';checkGps.at=Date.now();renderCheckGps();return loc});
 return checkGps.promise;
}
function openCheck(){
 const sh=myActiveShift();if(!sh)return toast('Não há plantão ativo.','warn');
 let d=getCheckDraft();
 if(!d){d={id:uid(),shiftId:sh.id,startedAt:new Date().toISOString(),text:'',photos:[],gps:true,awaitingCamera:false};saveCheckDraft(d)}
 renderCheck();openModal('checkModal');
 if(d.gps)startCheckGps();
}
function closeCheck(){$('checkModal').classList.remove('show');render()}   // mantém o rascunho
function checkRule(){const sh=myActiveShift();return sh?ruleOf(sh.siteId):null}
const checkNeedsPhoto=()=>checkRule()?.photo!==false;
function renderCheck(){
 const d=getCheckDraft();if(!d)return;const rule=checkRule();
 $('checkBody').innerHTML=`
  <div class="field"><label for="checkText">Observação (opcional)</label><textarea id="checkText" rows="3" placeholder="O que foi verificado, condições do local...">${esc(d.text)}</textarea></div>
  <section class="photo-cap" aria-label="Registro fotográfico">
   <div class="photo-cap-head"><span class="label">Registro fotográfico${checkNeedsPhoto()?' · obrigatório':''}</span><span class="photo-count" id="checkCount"></span></div>
   <button class="btn secondary block lg" data-act="checkPhoto">${ic('camera')} Tirar foto</button>
   <div class="tray" id="checkTray" style="margin-top:10px"></div>
   <p class="tray-empty" id="checkTrayEmpty">Tire quantas fotos precisar. Toque numa miniatura para ampliar.</p>
  </section>
  <label class="check gps-line"><input type="checkbox" id="checkGpsOn" ${d.gps?'checked':''}><span id="checkGpsTxt"></span></label>
  ${rule?.gps?'<p class="hint" style="margin:-8px 0 12px">Este posto exige localização nas checagens.</p>':''}
  <div class="modal-actions"><button class="btn primary block lg" id="checkDoneBtn" data-act="checkDone"></button><button class="btn ghost block" data-act="checkDiscard">Descartar checagem</button></div>`;
 $('checkText').addEventListener('input',e=>{const cur=readCheckDraft();if(cur){cur.text=e.target.value;saveCheckDraft(cur)}});
 $('checkGpsOn').addEventListener('change',e=>{const cur=readCheckDraft();if(cur){cur.gps=e.target.checked;saveCheckDraft(cur)}if(e.target.checked)startCheckGps();renderCheckGps()});
 renderCheckTray();renderCheckGps();
}
function renderCheckTray(){
 const d=getCheckDraft();if(!d||!$('checkTray'))return;const n=d.photos.length;
 $('checkTray').innerHTML=d.photos.map((p,i)=>`<div class="tray-item">${imgTag(p.ref,`Foto ${i+1} da checagem`)}<span class="tray-n">${i+1}</span><button class="tray-del" data-act="checkDel" data-i="${i}" aria-label="Excluir foto ${i+1}">${ic('x')}</button></div>`).join('');
 $('checkTrayEmpty').classList.toggle('hidden',n>0);
 const cnt=$('checkCount');cnt.textContent=n?`${n} foto${n>1?'s':''}`:'nenhuma foto';cnt.classList.toggle('ok',n>0);
 const btn=$('checkDoneBtn'),blocked=checkNeedsPhoto()&&!n;
 btn.disabled=blocked;btn.innerHTML=`${ic('check')} ${blocked?'Tire ao menos 1 foto':`Concluir checagem${n?` · ${n} foto${n>1?'s':''}`:''}`}`;
 const last=$('checkTray').lastElementChild;if(last)last.scrollIntoView({block:'nearest',inline:'end'});
}
function renderCheckGps(){
 const t=$('checkGpsTxt');if(!t)return;const on=$('checkGpsOn')?.checked;
 t.textContent=!on?'Registrar minha localização':checkGps.status==='busy'?'Obtendo localização…':checkGps.status==='ok'?`Localização obtida (±${checkGps.loc.accuracy} m)`:checkGps.status==='fail'?'Localização indisponível — tentaremos de novo ao concluir':'Registrar minha localização';
}
/* Abre a câmera no mesmo toque (exigência do Android/iOS). */
function checkTakePhoto(){
 const d=getCheckDraft();if(!d)return toast('Não há plantão ativo.','warn');
 d.awaitingCamera=true;saveCheckDraft(d);
 const ci=$('checkCameraInput');ci.value='';ci.click();
}
$('checkCameraInput').addEventListener('cancel',()=>{const d=readCheckDraft();if(d){d.awaitingCamera=false;saveCheckDraft(d)}});
$('checkCameraInput').addEventListener('change',async e=>{
 const input=e.currentTarget,files=[...input.files||[]];
 await addCheckPhotos(files);input.value='';
});
async function addCheckPhotos(files){
 const d0=getCheckDraft();if(!d0)return;
 if(!files.length){d0.awaitingCamera=false;saveCheckDraft(d0);return}
 busy(true,files.length>1?`Processando ${files.length} fotos...`:'Processando foto...');
 const added=[];
 try{
  // usa a localização já obtida; espera no máximo 5 s para não travar a sequência de fotos
  const loc=d0.gps?await Promise.race([checkGps.promise||Promise.resolve(checkGps.loc),new Promise(r=>setTimeout(()=>r(checkGps.loc),5000))]):null;
  const site=myActiveShift()?.siteName;
  for(const f of files){const ph=await processPhoto(f,stampLines(site,loc));added.push({ref:ph.ref,hash:ph.hash||null,capturedAt:new Date().toISOString()})}
 }catch(err){console.error(err);toast('Não foi possível usar esta foto: '+(err?.message||'erro desconhecido')+'. Tente de novo.','err',8000)}
 finally{
  const d=getCheckDraft();   // relê: o rascunho pode ter mudado enquanto processava
  if(d){d.photos.push(...added);d.awaitingCamera=false;saveCheckDraft(d)}else added.forEach(p=>Photos.del(p.ref));
  busy(false);renderCheckTray();
  if(added.length)toast(added.length>1?`${added.length} fotos adicionadas.`:`Foto ${d?.photos.length||1} adicionada.`,'ok',2200);
 }
}
function checkDeletePhoto(i){
 const d=getCheckDraft();if(!d||!d.photos[i])return;
 const [p]=d.photos.splice(i,1);saveCheckDraft(d);Photos.del(p.ref);renderCheckTray();toast('Foto excluída.','ok',1800);
}
async function concludeCheck(){
 const d=getCheckDraft();if(!d)return toast('Não há plantão ativo.','warn');
 if(checkNeedsPhoto()&&!d.photos.length)return toast('Tire ao menos uma foto para concluir.','warn');
 const rule=checkRule(),text=($('checkText')?.value??d.text).trim();
 busy(true,'Registrando checagem...');
 try{
  let loc=null;
  if(d.gps){loc=checkGps.status==='ok'&&Date.now()-checkGps.at<120000?checkGps.loc:await startCheckGps(true)}
  syncFromStorage();
  pending={type:'Checagem',text,entryPlace:null,gpsRequired:!!rule?.gps};
  const rec=await finalizePoint(d.photos.map(p=>({ref:p.ref,hash:p.hash,capturedAt:p.capturedAt})),loc);
  if(rec){dropCheckDraft(d,false);$('checkModal').classList.remove('show');render()}   // fotos agora pertencem ao registro
  else toast('A checagem não foi registrada. As fotos continuam salvas no rascunho.','err',7000);
 }catch(e){toast('Falha ao registrar: '+e.message+'. As fotos continuam salvas.','err',8000)}
 finally{busy(false)}
}
async function discardCheck(){
 const d=getCheckDraft();
 if(d?.photos.length&&!await confirmDlg('Descartar checagem?',`As ${d.photos.length} foto(s) desta checagem serão apagadas do aparelho.`,'Descartar',true))return;
 dropCheckDraft(d);$('checkModal').classList.remove('show');render();
}
/* Ao abrir o app: retoma a checagem em andamento e, no Android, recupera a foto tirada
   caso o sistema tenha fechado o app enquanto a câmera estava aberta. */
async function resumeCheckDraft(){
 const d=getCheckDraft();

 if(!d)return;

 if(recovered&&d.awaitingCamera){
  const blob=dataUrlToBlob('data:image/jpeg;base64,'+recovered);
  await addCheckPhotos([new File([blob],'foto_recuperada.jpg',{type:'image/jpeg'})]);
 }
}

function renderSosModal(){
 const open=myOpenSos(),sh=myActiveShift(),tel=db.supervisorPhone?db.supervisorPhone.replace(/[^\d+]/g,''):'';
 const call=tel?`<a class="btn secondary block lg" href="tel:${esc(tel)}">${ic('phone')} Ligar para supervisão</a>`:'<p class="hint">Telefone da supervisão não cadastrado. Use rádio ou outro meio de contato.</p>';
 const honest='<p class="hint">O alerta fica registrado no Sentinela com seu nome, posto, horário e localização (se disponível) e aparece no painel da supervisão que usa este sistema. O Sentinela ainda não envia avisos automáticos por SMS ou ligação — <b>se puder, ligue</b>.</p>';
 if(open){
  const last=open.history[open.history.length-1];
  $('sosBody').innerHTML=`<div class="sos-status"><div class="row-flex"><span class="pill ${occTone(open)}">${esc(occLabel(open))}</span><span class="muted">Acionado às ${fmtT(open.createdAt)}</span></div>
   <div class="kv"><div><dt>Local</dt><dd>${esc(open.siteName)}</dd></div><div><dt>Localização</dt><dd>${open.location?`<a href="${mapLink(open.location)}" target="_blank" rel="noopener">±${esc(open.location.accuracy)} m</a>`:'Indisponível'}</dd></div></div>
   ${open.status==='andamento'&&last?`<div class="note info">Supervisão: ${esc(last.note||last.action)} · ${fmtT(last.at)}</div>`:'<div class="note warn">Aguardando reconhecimento da supervisão.</div>'}</div>
   ${call}${honest}<div class="modal-actions"><button class="btn ghost block" data-act="sosCancel" data-id="${open.id}">Acionei por engano — cancelar alerta</button><button class="btn ghost block" onclick="closeSos()">Fechar</button></div>`;
  return;
 }
 $('sosBody').innerHTML=`<p>Use em situação de risco. Seu nome, ${sh?'o posto <b>'+esc(sh.siteName)+'</b>':'o local'}, o horário e a localização serão registrados.</p>
  <button class="hold" id="holdBtn"><span>Segure para acionar o SOS</span></button>
  ${call}${honest}<div class="modal-actions"><button class="btn ghost block" onclick="closeSos()">Cancelar</button></div>`;
 const b=$('holdBtn');
 b.addEventListener('pointerdown',e=>{e.preventDefault();startHold()});
 ['pointerup','pointerleave','pointercancel'].forEach(t=>b.addEventListener(t,stopHold));
 b.addEventListener('keydown',e=>{if((e.key===' '||e.key==='Enter')&&!e.repeat){e.preventDefault();startHold()}});
 b.addEventListener('keyup',e=>{if(e.key===' '||e.key==='Enter')stopHold()});
 b.addEventListener('contextmenu',e=>e.preventDefault());
}
function startHold(){
 if(holdTimer)return;holdStart=Date.now();const b=$('holdBtn');
 holdTimer=setInterval(()=>{const p=Math.min(1,(Date.now()-holdStart)/1500);b.style.setProperty('--p',p);if(p>=1){stopHold();triggerSos()}},30);
 try{navigator.vibrate?.(30)}catch(e){}
}
function stopHold(){if(holdTimer){clearInterval(holdTimer);holdTimer=null}$('holdBtn')?.style.setProperty('--p',0)}
