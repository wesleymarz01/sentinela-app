 const sh=o.shiftId?shiftById(o.shiftId):null,sos=o.type==='SOS';
 const acts=[];
 if(o.status==='nova')acts.push(`<button class="btn primary" data-act="occStatus" data-id="${o.id}" data-s="andamento">${sos?'Reconhecer alerta':'Iniciar atendimento'}</button>`);
 if(o.status==='nova'||o.status==='andamento')acts.push(`<button class="btn secondary" data-act="occStatus" data-id="${o.id}" data-s="resolvida">${sos?'Encerrar alerta':'Resolver'}</button>`);
 if(o.status==='resolvida')acts.push(`<button class="btn secondary" data-act="occStatus" data-id="${o.id}" data-s="andamento">Reabrir</button>`);
 if(o.status==='info')acts.push(`<button class="btn secondary" data-act="occStatus" data-id="${o.id}" data-s="nova">Acompanhar como ocorrência</button>`);
 acts.push(`<button class="btn ghost" data-act="occNote" data-id="${o.id}">${ic('plus')} Nota</button>`);
 return{kicker:o.type,title:sos?`SOS · ${o.guardName}`:(firstLine(o.text)||o.type),html:`
  <div class="row-flex">${o.status==='info'?'<span class="pill">Informativo</span>':occPill(o)}<span class="muted" style="font-size:13px">Registrada em ${fmtDT(o.createdAt)}</span></div>
  <dl class="kv"><div><dt>Vigilante</dt><dd>${esc(o.guardName)}</dd></div><div><dt>Posto</dt><dd>${esc(o.siteName||'—')}</dd></div>
   <div><dt>Localização</dt><dd>${o.location?`<a href="${mapLink(o.location)}" target="_blank" rel="noopener">${esc(o.location.lat)}, ${esc(o.location.lon)}</a> <span class="muted">±${esc(o.location.accuracy)} m</span>`:'Não registrada'}</dd></div>
   <div><dt>Plantão</dt><dd>${sh?`<button class="link" data-act="openShift" data-id="${sh.id}">${fmtDShort(sh.startedAt)} · ${fmtT(sh.startedAt)}</button>`:'—'}</dd></div></dl>
  <div class="drawer-actions">${acts.join('')}</div>
  <div><h4>Descrição</h4><p style="white-space:pre-wrap">${esc(o.text||'Sem descrição.')}</p></div>
  ${photosOf(o).length?`<div><h4>Evidências (${photosOf(o).length})</h4><div class="photo-grid">${photosOf(o).map(r=>imgTag(r)).join('')}</div></div>`:''}
  <div><h4>Acompanhamento</h4>${o.history.length?`<div class="timeline">${o.history.slice().reverse().map(h=>`<div class="tl"><div class="tl-time">${fmtT(h.at)}</div><div class="tl-mark"><i class="info"></i></div><div class="tl-body"><b>${esc(h.action)}</b><div class="d">${esc(h.by)} · ${fmtDShort(h.at)}</div>${h.note?`<p>${esc(h.note)}</p>`:''}</div></div>`).join('')}</div>`:'<p class="muted">Sem movimentações.</p>'}</div>`};
};
async function changeOccStatus(id,status){
 const o=occById(id);if(!o)return;
 const need=status==='resolvida';
 const r=await dialog({title:{andamento:o.type==='SOS'?'Reconhecer alerta SOS':'Iniciar atendimento',resolvida:o.type==='SOS'?'Encerrar alerta SOS':'Resolver ocorrência',nova:'Acompanhar como ocorrência'}[status]||'Atualizar',
  fields:[{id:'note',label:need?'Como foi resolvido':'Observação (opcional)',type:'textarea',rows:3,required:need,placeholder:need?'Providências tomadas, quem foi acionado...':'Ex.: supervisor a caminho, equipe acionada...'}],ok:'Confirmar'});
 if(!r)return;syncFromStorage();setOccStatus(id,status,r.note);persist();toast('Ocorrência atualizada.');
}
async function addOccNote(id){
 const r=await dialog({title:'Adicionar nota',fields:[{id:'note',label:'Nota de acompanhamento',type:'textarea',rows:3,required:true}],ok:'Adicionar'});
 if(!r)return;syncFromStorage();const o=occById(id);if(!o)return;
 o.history.push({at:new Date().toISOString(),by:'Supervisão',action:'Nota',note:r.note});audit('Nota em ocorrência',{guardName:o.guardName,siteName:o.siteName,reason:r.note});persist();

DRAWERS.shift=id=>{
 const sh=shiftById(id);if(!sh)return null;
 const g=guardById(sh.guardId),en=entryOf(sh),ex=exitOf(sh),a=shiftStart(sh),b=shiftEnd(sh),c=checksOf(sh),exp=expectedChecks(sh),occ=shiftOccs(sh);
 const att=g?[addDays(dayKey(a),-1),dayKey(a)].map(k=>attendance(g,k)).find(x=>x?.shift&&sameId(x.shift.id,sh.id)):null;
 const adj=db.pointAdjustments.filter(x=>sameId(x.shiftId,sh.id)).sort(byNewest);
 return{kicker:'Plantão',title:`${sh.guardName} · ${sh.siteName}`,html:`
  <div class="row-flex">${sh.closed?(en&&ex?tone2pill('','Concluído'):tone2pill('warn','Incompleto')):tone2pill('ok','Em serviço',true)}${att?.late?tone2pill('warn',`Entrada +${att.delayMin} min`):''}${sh.placeNeedsReview?`<button class="pill warn plain" data-act="editSite" data-id="${sh.siteId}" style="border:0;cursor:pointer">Local a revisar</button>`:''}</div>
  <dl class="kv"><div><dt>Entrada</dt><dd class="mono">${fmtDT(a)}${en&&adjustmentFor(en)?' <span class="muted">(ajustada)</span>':''}</dd></div><div><dt>Saída</dt><dd class="mono">${b?fmtDT(b):'—'}${ex&&adjustmentFor(ex)?' <span class="muted">(ajustada)</span>':''}</dd></div>
   <div><dt>Duração</dt><dd class="mono">${fmtMs((b||Date.now())-a)} h</dd></div><div><dt>Escala prevista</dt><dd>${att?`${fmtT(att.plan.start)}–${fmtT(att.plan.end)}`:'Flexível / fora da escala'}</dd></div>
   <div><dt>Checagens</dt><dd>${c.length}${exp?` de ${exp} previstas`:''}${c.some(x=>x.late)?` · <span class="delta-late">${c.filter(x=>x.late).length} fora do prazo</span>`:''}</dd></div><div><dt>Ocorrências</dt><dd>${occ.length}</dd></div></dl>
  <div class="drawer-actions"><button class="btn secondary" data-act="dlShift" data-id="${sh.id}">${ic('download')} Baixar relatório</button><button class="btn secondary" data-act="printShift" data-id="${sh.id}">${ic('print')} Imprimir / PDF</button>${en?`<button class="btn ghost" data-act="adjust" data-id="${en.id}">Ajustar entrada</button>`:''}${ex?`<button class="btn ghost" data-act="adjust" data-id="${ex.id}">Ajustar saída</button>`:''}</div>
  ${sh.draft?`<div><h4>Resumo do vigilante</h4><p style="white-space:pre-wrap">${esc(sh.draft)}</p></div>`:''}
  <div><h4>Registros</h4><div class="timeline">${shiftEvents(sh).map(tlItem).join('')||'<p class="muted">Sem registros.</p>'}</div></div>
  <div><h4>Relato narrativo para o relatório</h4><textarea id="drawerNarr" rows="7" placeholder="Gere o texto a partir dos registros e revise...">${esc(sh.narrative||'')}</textarea>
   <div class="drawer-actions" style="margin-top:8px"><button class="btn sm secondary" data-act="genNarr" data-id="${sh.id}">Gerar a partir dos registros</button><button class="btn sm primary" data-act="saveNarr" data-id="${sh.id}">Salvar texto</button></div>
   <p class="hint" style="margin-top:6px">O texto salvo entra no relatório do plantão.</p></div>
  ${adj.length?`<div><h4>Ajustes de ponto</h4>${adj.map(x=>`<div class="note" style="margin-bottom:8px">${fmtDT(x.originalAt)} → <b>${fmtDT(x.adjustedAt)}</b><br>${esc(x.reason)}<br><span class="muted">${esc(x.author)} · ${fmtDT(x.createdAt)}</span></div>`).join('')}</div>`:''}`};
};
async function adjustRecord(recId){
 const rec=db.records.find(r=>sameId(r.id,recId));if(!rec)return;
 const cur=new Date(effAt(rec)),local=`${dayKey(cur)}T${pad(cur.getHours())}:${pad(cur.getMinutes())}`;
 const r=await dialog({title:`Ajustar ${rec.type.toLowerCase()}`,body:`Registro original: <b>${fmtDT(rec.createdAt)}</b>. O original é preservado; o ajuste fica registrado com responsável e justificativa.`,
  fields:[{id:'at',label:'Horário validado',type:'datetime-local',value:local,required:true},{id:'reason',label:'Justificativa',type:'textarea',rows:3,required:true,validate:v=>v.length<8?'Explique o motivo e a autorização (mín. 8 caracteres).':''}],ok:'Registrar ajuste'});
 if(!r)return;const at=new Date(r.at);if(Number.isNaN(at.getTime()))return toast('Horário inválido.','warn');
 syncFromStorage();const re=db.records.find(x=>sameId(x.id,recId));if(!re)return;
 const a={id:uid(),recordId:re.id,shiftId:re.shiftId||null,guardId:re.guardId,guardName:re.guardName,siteName:re.siteName,originalAt:re.createdAt,previousAt:new Date(effAt(re)).toISOString(),adjustedAt:at.toISOString(),reason:r.reason,author:'Supervisão',createdAt:new Date().toISOString()};
 db.pointAdjustments.push(a);audit('Ajuste de ponto registrado',{guardName:a.guardName,siteName:a.siteName,reason:r.reason});persist();toast('Ajuste registrado. O horário original foi preservado.');
}
function genNarrative(id){const sh=shiftById(id);if(!sh)return;$('drawerNarr').value=narrativeText(sh);$('drawerNarr').focus();toast('Texto gerado. Revise e salve.')}
function saveNarrative(id){syncFromStorage();const sh=shiftById(id);if(!sh)return;const v=$('drawerNarr').value.trim();if(!v)return toast('Gere ou escreva o texto antes de salvar.','warn');sh.narrative=v;audit('Relatório narrativo revisado',{guardName:sh.guardName,siteName:sh.siteName,shiftId:sh.id});$('drawerNarr').blur();persist();toast('Texto salvo no relatório do plantão.')}

 const shifts=db.shifts.filter(s=>shiftOfGuard(s,g)).sort((a,b)=>(b.startedAt||'').localeCompare(a.startedAt||'')).slice(0,8);

 return{kicker:'Vigilante',title:g.name,html:`

  <div><h4>Ocorrências recentes</h4>${occ.length?`<div class="list">${occ.map(occRow).join('')}</div>`:'<p class="muted">Nenhuma ocorrência.</p>'}</div>`};

function guardFields(g={}){
 return[
  {id:'name',label:'Nome completo',value:g.name||'',required:true},
  {id:'code',label:'Código de acesso',value:g.code||'',placeholder:'Ex.: VIG-024',required:true,hint:'O vigilante usa este código para entrar.',validate:v=>db.guards.some(x=>!sameId(x.id,g.id)&&x.code.toLowerCase()===v.toLowerCase())?'Esse código já existe.':''},
  {id:'mode',label:'Controle de jornada',type:'select',value:g.scheduleMode||'scheduled',options:[['scheduled','Escala programada — calcula atrasos e faltas'],['flexible','Flexível — apenas registra os horários']]},
  {row:[{id:'start',label:'Entrada prevista',type:'time',value:g.scheduleStart||'18:00'},{id:'end',label:'Saída prevista',type:'time',value:g.scheduleEnd||'06:00'}]},
  {id:'cycle',label:'Tipo de escala',type:'select',value:g.scheduleCycle||'semanal',options:[['semanal','Dias da semana'],['12x36','12x36 (dia sim, dia não)']]},
  {id:'days',label:'Dias de trabalho',type:'weekdays',value:g.scheduleDays||[0,1,2,3,4,5,6]},
  {id:'anchor',label:'Um dia de trabalho de referência',type:'date',value:g.scheduleAnchor||todayKey(),hint:'A partir desta data o sistema alterna os dias da escala 12x36.'},
  {id:'temp',label:'Acesso temporário (funcionário extra)',type:'checkbox',value:!!g.temporary},
  {id:'exp',label:'Acesso válido até',type:'date',value:g.expiresAt||'',validate:(v,res)=>res.temp&&!v?'Informe a validade do acesso temporário.':''}
 ];
}
function guardFormBehavior(b){
 const v=id=>$('dlgf_'+id),show=(id,on)=>$('wrap_dlgf_'+id)?.classList.toggle('hidden',!on);
 const sync=()=>{const sch=v('mode').value==='scheduled',w=v('cycle').value==='semanal';
  [v('start'),v('end')].forEach(el=>el.closest('.grid-2').classList.toggle('hidden',!sch));show('cycle',sch);show('days',sch&&w);show('anchor',sch&&!w);show('exp',v('temp').checked)};
 ['mode','cycle','temp'].forEach(id=>v(id).addEventListener('change',sync));sync();
}
async function guardEditor(id){
 const g=id?guardById(id):null;
 const r=await dialog({title:g?'Editar vigilante':'Novo vigilante',fields:guardFields(g||{}),ok:g?'Salvar':'Cadastrar',onRender:guardFormBehavior});
 if(!r)return;
 if(r.mode==='scheduled'&&r.cycle==='semanal'&&!r.days.length)return toast('Selecione ao menos um dia de trabalho.','warn');
 if(r.temp&&r.exp<todayKey()&&!g)return toast('A validade precisa ser hoje ou uma data futura.','warn');
 syncFromStorage();
 const data={name:r.name,code:r.code,scheduleMode:r.mode,scheduleStart:r.start||'18:00',scheduleEnd:r.end||'06:00',scheduleCycle:r.cycle,scheduleDays:r.days,scheduleAnchor:r.anchor||todayKey(),scheduleSince:g&&isScheduled(g)&&g.scheduleSince?g.scheduleSince:todayKey(),temporary:r.temp,expiresAt:r.temp?r.exp:null};
 if(!g){
  if(db.guards.some(x=>x.code.toLowerCase()===r.code.toLowerCase()))return toast('Esse código já existe.','warn');
  db.guards.push({id:uid(),active:true,...data});audit(r.temp?'Acesso temporário criado':'Vigilante cadastrado',{guardName:r.name});persist();toast('Vigilante cadastrado. Entregue o código de acesso a ele.');return;
 }
 const cur=guardById(g.id);if(!cur)return;const oldName=cur.name;Object.assign(cur,data);
 if(oldName!==cur.name)[...db.records,...db.occurrences,...db.shifts,...db.extraRequests].forEach(x=>{if(sameId(x.guardId,cur.id))x.guardName=cur.name});
 audit('Vigilante editado',{guardName:cur.name});persist();toast('Cadastro atualizado.');
}
async function toggleGuard(id){
 const g=guardById(id);if(!g)return;const off=g.active!==false;
 if(off&&activeShifts().some(s=>sameId(s.guardId,g.id)))return toast('Este vigilante está em plantão. Aguarde o encerramento antes de desativar.','warn',6000);
 if(!await confirmDlg(off?'Desativar acesso?':'Reativar acesso?',off?`${esc(g.name)} não conseguirá mais entrar. O histórico é preservado.`:`${esc(g.name)} voltará a ter acesso.`,off?'Desativar':'Reativar',off))return;
 syncFromStorage();const cur=guardById(id);cur.active=!off;audit(off?'Acesso desativado':'Acesso reativado',{guardName:cur.name});persist();
}
async function delGuard(id){
 const g=guardById(id);if(!g)return;
 if(!await confirmDlg('Excluir vigilante?',`${esc(g.name)} não possui registros. Esta ação não pode ser desfeita.`,'Excluir',true))return;
 syncFromStorage();db.guards=db.guards.filter(x=>!sameId(x.id,id));audit('Vigilante excluído',{guardName:g.name});closeDrawer();persist();
}
async function extendTemporary(id){
 const g=guardById(id);if(!g)return;
 const r=await dialog({title:'Prorrogar acesso temporário',fields:[{id:'d',label:'Nova data de validade',type:'date',value:g.expiresAt||todayKey(),required:true,validate:v=>v<todayKey()?'Escolha hoje ou uma data futura.':''}],ok:'Prorrogar'});
 if(!r)return;syncFromStorage();const cur=guardById(id);cur.expiresAt=r.d;audit('Acesso temporário prorrogado',{guardName:cur.name});persist();

async function decideExtra(id,approve){
 const req=db.extraRequests.find(x=>sameId(x.id,id));if(!req)return;
 const r=await dialog({title:approve?'Aprovar plantão extra':'Recusar plantão extra',body:`${esc(req.guardName)} · ${esc(req.siteName)} · ${fmtKey(req.date)} ${esc(req.start)}–${esc(req.end)}`,fields:[{id:'note',label:approve?'Observação (opcional)':'Motivo da recusa',type:'textarea',rows:3,required:!approve}],ok:approve?'Aprovar':'Recusar',danger:!approve});
 if(!r)return;syncFromStorage();const cur=db.extraRequests.find(x=>sameId(x.id,id));if(!cur)return;
 cur.status=approve?'Aprovado':'Recusado';cur.reviewedAt=new Date().toISOString();cur.reviewedBy='Supervisão';cur.reviewNote=r.note||'';
 audit('Solicitação de extra '+cur.status.toLowerCase(),{guardName:cur.guardName,siteName:cur.siteName,reason:cur.reviewNote});persist();
}

/* ---------- linhas de frequência (plantões + faltas) ---------- */
function nightMs(a,b){let t=0;const d=new Date(a);d.setHours(0,0,0,0);d.setDate(d.getDate()-1);for(;d.getTime()<=b;d.setDate(d.getDate()+1)){const s=new Date(d);s.setHours(22,0,0,0);const e=new Date(d);e.setDate(e.getDate()+1);e.setHours(5,0,0,0);t+=Math.max(0,Math.min(b,e.getTime())-Math.max(a,s.getTime()))}return t}
function attendanceRows({from,to,guardId='',siteId=''}){
 const rows=[],now=Date.now();
 db.shifts.forEach(sh=>{
  const a=shiftStart(sh),date=dayKey(a);
  if(date<from||date>to)return;
  if(guardId&&!sameId(sh.guardId,guardId))return;
  if(siteId&&!sameId(sh.siteId,siteId))return;
  const g=guardById(sh.guardId),en=entryOf(sh),ex=exitOf(sh),b=shiftEnd(sh),ok=a&&b&&b>=a;
  const att=g&&isScheduled(g)?[addDays(date,-1),date].map(k=>attendance(g,k,now)).find(x=>x?.shift&&sameId(x.shift.id,sh.id)):null;
  const checks=checksOf(sh);
  rows.push({date,guard:sh.guardName,guardId:sh.guardId,site:sh.siteName,shift:sh,a,b:b||null,dur:ok?b-a:null,night:ok?nightMs(a,b):null,
   plan:att?.plan||null,delayMin:att?att.delayMin:null,dOut:att&&b?Math.round((b-att.plan.end)/60000):null,late:!!att?.late,
   status:!sh.closed?'servico':(en&&ex?'concluido':'incompleto'),checks:checks.length,expected:expectedChecks(sh),lateChecks:checks.filter(c=>c.late).length,
   occ:shiftOccs(sh).length,adjusted:!!(adjustmentFor(en)||adjustmentFor(ex))});
 });
 if(!siteId)db.guards.filter(g=>isScheduled(g)&&(!guardId||sameId(g.id,guardId))).forEach(g=>{
  for(let k=from;k<=to;k=addDays(k,1)){
   const att=attendance(g,k,now);
   if(att&&(att.status==='falta'||att.status==='atrasado'))rows.push({date:k,guard:g.name,guardId:g.id,site:'',shift:null,a:null,b:null,dur:null,night:null,plan:att.plan,delayMin:null,dOut:null,late:false,status:att.status,checks:0,expected:0,lateChecks:0,occ:0});
  }
 });
 return rows.sort((x,y)=>y.date.localeCompare(x.date)||x.guard.localeCompare(y.guard));
}
function summarize(rows){
 const s={shifts:0,ms:0,late:0,lateMin:0,absences:0,incomplete:0,night:0};
 rows.forEach(r=>{if(r.shift){s.shifts++;s.ms+=r.dur||0;s.night+=r.night||0}if(r.late){s.late++;s.lateMin+=Math.max(0,r.delayMin||0)}if(r.status==='falta')s.absences++;if(r.status==='incompleto')s.incomplete++});
 return s;
}

 busy(true,'Montando relatório com fotos...');
 try{downloadFile(await buildShiftReport(sh),'text/html;charset=utf-8',`relatorio_${fileSafe(sh.guardName)}_${dayKey(sh.startedAt)}.html`);toast('Relatório baixado. Abra no navegador e use “Imprimir / Salvar como PDF”.')}
 catch(e){toast('Falha ao gerar relatório: '+e.message,'err')}finally{busy(false)}
}
async function printShiftReport(id){
 const sh=shiftById(id);if(!sh)return toast('Plantão não encontrado.','warn');
 // no navegador a janela abre já no toque (senão o bloqueador de pop-up impede); no app Android a impressão é nativa
 const w=isAndroidApp()?null:window.open('','_blank');if(!isAndroidApp()&&!w)return toast('Permita pop-ups para imprimir o relatório.','warn');
 w?.document.write('<p style="font:16px Arial;padding:24px">Montando relatório…</p>');
 busy(true,'Montando relatório com fotos...');
 try{printHtml(await buildShiftReport(sh),`Plantão ${sh.guardName}`,w)}catch(e){w?.close();toast('Falha ao gerar relatório: '+e.message,'err')}finally{busy(false)}
}

/* =====================================================================
   PACOTE DE PLANTÃO (vigilante → supervisão, sem servidor) E BACKUP
   ===================================================================== */
async function collectPhotos(items){const refs=new Set(items.flatMap(photosOf)),out={};for(const r of refs){const u=await Photos.dataUrl(r);if(u)out[r]=u}return out}
async function remapPhotos(map,items){const m={};for(const[ref,url]of Object.entries(map||{})){if(!url)continue;m[ref]=ref.startsWith('data:')?ref:await Photos.put(dataUrlToBlob(url),url)}items.forEach(e=>{e.photos=photosOf(e).map(r=>m[r]||r);delete e.photo})}
async function shareShift(id){
 const sh=shiftById(id);if(!sh)return toast('Plantão não encontrado.','warn');
 busy(true,'Preparando pacote do plantão...');
 try{
  const recs=shiftRecords(sh),occs=shiftOccs(sh),g=guardById(sh.guardId),s=siteById(sh.siteId);
  const pkg={sentinela:'pacote-plantao',version:6,exportedAt:new Date().toISOString(),company:db.company,guard:{id:sh.guardId,name:sh.guardName,code:g?.code||''},site:s||{id:sh.siteId,name:sh.siteName,address:sh.siteAddress||''},shift:sh,records:recs,occurrences:occs,photos:await collectPhotos([...recs,...occs])};
  const name=`plantao_${fileSafe(sh.guardName)}_${dayKey(sh.startedAt)}.sentinela.json`,file=new File([JSON.stringify(pkg)],name,{type:'application/json'});
  busy(false);
  if(navigator.canShare?.({files:[file]})){try{await navigator.share({files:[file],title:'Plantão Sentinela',text:`Plantão de ${sh.guardName} — ${sh.siteName}`});return}catch(e){if(e.name==='AbortError')return}}
  downloadFile(file,null,name);toast(isAndroidApp()?'Escolha por onde enviar o pacote à supervisão (WhatsApp, e-mail...).':'Pacote baixado. Envie o arquivo à supervisão (WhatsApp ou e-mail) para importar no painel.','ok',8000);
 }catch(e){toast('Falha ao preparar o pacote: '+e.message,'err')}finally{busy(false)}
}
async function importPackage(file){
 busy(true,'Importando pacote...');
 try{
  const pkg=JSON.parse(await file.text());if(pkg.sentinela!=='pacote-plantao')throw new Error('Este arquivo não é um pacote de plantão do Sentinela.');
  syncFromStorage();if(shiftById(pkg.shift.id))throw new Error('Este plantão já foi importado.');
  let g=db.guards.find(x=>sameId(x.id,pkg.guard.id)||(pkg.guard.code&&x.code.toLowerCase()===pkg.guard.code.toLowerCase())||x.name===pkg.guard.name);
  if(!g){g={id:pkg.guard.id||uid(),name:pkg.guard.name,code:pkg.guard.code||('IMP-'+uid()),active:true,scheduleMode:'flexible',scheduleStart:'18:00',scheduleEnd:'06:00'};db.guards.push(g)}
  let s=db.sites.find(x=>sameId(x.id,pkg.site.id)||x.name.toLowerCase()===String(pkg.site.name).toLowerCase());
  if(!s){s={...pkg.site,needsReview:true};db.sites.push(s)}
  const items=[...pkg.records,...pkg.occurrences];await remapPhotos(pkg.photos,items);
  items.forEach(e=>{e.guardId=g.id;e.siteId=s.id});
  db.shifts.push({...pkg.shift,guardId:g.id,siteId:s.id});db.records.push(...pkg.records);db.occurrences.push(...pkg.occurrences);
  db=migrate(db);
  audit('Pacote de plantão importado',{guardName:g.name,siteName:s.name,reason:`${pkg.records.length} registro(s), ${pkg.occurrences.length} ocorrência(s)`});persist();toast(`Plantão de ${g.name} importado com ${pkg.records.length+pkg.occurrences.length} registro(s).`,'ok',6000);
 }catch(e){toast(e.message||'Falha ao importar.','err',7000)}finally{busy(false)}
}
async function exportBackup(){
 busy(true,'Gerando backup completo...');
 try{const copy=JSON.parse(JSON.stringify(db));delete copy.adminAuth;const photos=await collectPhotos([...db.records,...db.occurrences]);downloadFile(JSON.stringify({sentinela:'backup',version:6,exportedAt:new Date().toISOString(),demo:demoMode,db:copy,photos}),'application/json',`sentinela_backup_${todayKey()}.json`);toast('Backup gerado. Guarde o arquivo em local seguro.')}
 catch(e){toast('Falha no backup: '+e.message,'err')}finally{busy(false)}
}
async function restoreBackup(file){
 try{
  const pkg=JSON.parse(await file.text());if(pkg.sentinela!=='backup'||!pkg.db)throw new Error('Este arquivo não é um backup do Sentinela.');
  if(!await confirmDlg('Restaurar backup?',`Substitui TODOS os dados atuais por ${pkg.db.records?.length||0} registro(s) do backup de ${fmtDT(pkg.exportedAt)}. A senha atual da supervisão é mantida.`,'Restaurar',true))return;
  busy(true,'Restaurando...');const next=migrate(pkg.db);next.adminAuth=db.adminAuth;await remapPhotos(pkg.photos,[...next.records,...next.occurrences]);db=next;persist();$('sideCompany').textContent=db.company;toast('Backup restaurado.');
 }catch(e){toast(e.message||'Falha ao restaurar.','err',7000)}finally{busy(false)}
}
$('importPackageInput').addEventListener('change',async e=>{const f=e.target.files[0];e.target.value='';if(f)await importPackage(f)});
$('importBackupInput').addEventListener('change',async e=>{const f=e.target.files[0];e.target.value='';if(f)await restoreBackup(f)});

function demoPhoto(label,hue){
 const c=document.createElement('canvas');c.width=480;c.height=320;const x=c.getContext('2d');
 const g=x.createLinearGradient(0,0,480,320);g.addColorStop(0,`hsl(${hue},18%,32%)`);g.addColorStop(1,`hsl(${hue+30},22%,10%)`);x.fillStyle=g;x.fillRect(0,0,480,320);
 x.strokeStyle='rgba(255,255,255,.05)';x.lineWidth=2;for(let i=-320;i<480;i+=26){x.beginPath();x.moveTo(i,0);x.lineTo(i+320,320);x.stroke()}
 x.fillStyle='rgba(0,0,0,.55)';x.fillRect(0,262,480,58);x.fillStyle='#a9efd2';x.font='700 12px Arial';x.fillText('FOTO ILUSTRATIVA • DEMONSTRAÇÃO',14,282);x.fillStyle='#fff';x.font='600 17px Arial';x.fillText(label,14,306);
 return c.toDataURL('image/jpeg',.7);
}
function demoSeed(){
 const now=Date.now(),H=36e5,M=6e4,D=emptyDb();
 D.company='Grupo Guardião · Demonstração';D.supervisorPhone='(11) 90000-0000';D.lateTolerance=10;
 const floor30=t=>{const d=new Date(t);d.setMinutes(d.getMinutes()<30?0:30,0,0);return d.getTime()};
 const hhmm=t=>{const d=new Date(t);return pad(d.getHours())+':'+pad(d.getMinutes())};
 const P101=floor30(now-5*H),P102=floor30(now-3*H),P105=floor30(now-50*M);
 const today=new Date().getDay(),yesterday=(today+6)%7;
 const G=(id,name,mode,start,end,days,extra={})=>({id,name,code:'DEMO-'+id,active:true,scheduleMode:mode,scheduleStart:start,scheduleEnd:end,scheduleCycle:'semanal',scheduleDays:days,...extra});
 const ALL=[0,1,2,3,4,5,6];
 const since=n=>({scheduleSince:dayKey(now-n*24*H)});
 D.guards=[G(101,'Marcos Silva','scheduled',hhmm(P101),hhmm(P101+12*H),ALL,since(9)),G(102,'Juliana Costa','scheduled',hhmm(P102),hhmm(P102+12*H),ALL,since(9)),G(103,'Rafael Mendes','flexible','18:00','06:00',ALL),G(104,'Carlos Oliveira','flexible','18:00','06:00',ALL),G(105,'Patrícia Souza','scheduled',hhmm(P105),hhmm(P105+12*H),[today],since(0)),G(106,'André Lima','scheduled','07:00','19:00',[yesterday],{temporary:true,expiresAt:dayKey(now+20*24*H),...since(2)})];
 D.sites=[{id:201,name:'Condomínio Parque Norte',address:'Setor Central · endereço fictício'},{id:202,name:'Centro Empresarial Orion',address:'Avenida das Palmeiras · endereço fictício'},{id:203,name:'Residencial Jardim das Águas',address:'Região Sul · endereço fictício'},{id:204,name:'Depósito Logístico Alfa',address:'Distrito Industrial · endereço fictício'},{id:205,name:'Evento Corporativo Alfa',address:'Informado pelo vigilante · endereço fictício',temporaryPlace:true,placeType:'Evento',needsReview:true}];
 D.rules={201:{interval:60,photo:true,gps:true,grace:10},202:{interval:30,photo:true,gps:true,grace:5},203:{interval:60,photo:true,gps:false,grace:10},204:{interval:120,photo:true,gps:true,grace:15}};
 const gi=id=>D.guards.find(g=>g.id===id),si=id=>D.sites.find(s=>s.id===id),loc=i=>({lat:+(-17.744+i*.0004).toFixed(6),lon:+(-48.625-i*.0003).toFixed(6),accuracy:7+i%9});
 const base=(sh,type,at,extra)=>{const d=new Date(at);return{id:uid(),shiftId:sh.id,guardId:sh.guardId,type,guardName:sh.guardName,siteId:sh.siteId,siteName:sh.siteName,siteAddress:si(sh.siteId).address,companyName:D.company,time:d.toLocaleTimeString('pt-BR'),date:d.toLocaleDateString('pt-BR'),createdAt:d.toISOString(),photos:[],photoMeta:[],location:null,text:'',...extra}};
 const rec=(sh,type,at,extra={})=>{const r=base(sh,type,at,extra);D.records.push(r);sh.events.push(r.id);return r};
 const occ=(sh,type,at,text,status,history=[],extra={})=>{const o=base(sh,type,at,{text,status,history:[{at:new Date(at).toISOString(),by:sh.guardName,action:'Registrada pelo vigilante'},...history],...extra});D.occurrences.push(o);sh.events.push(o.id);return o};
 const shift=(gid,siteId,start,end)=>{const g=gi(gid),s=si(siteId),sh={id:uid(),guardId:gid,guardName:g.name,siteId,siteName:s.name,siteAddress:s.address,placeType:s.placeType||'Posto',placeNeedsReview:!!s.needsReview,companyName:D.company,startedAt:new Date(start).toISOString(),closed:!!end,draft:'',events:[]};if(end){sh.closedAt=new Date(end).toISOString();sh.status='Encerrado'}D.shifts.push(sh);return sh};
 const ph=(label,hue)=>({photos:[demoPhoto(label,hue)],photoMeta:[{hash:null}]});
 // histórico: 9 dias de plantões encerrados (alimenta ponto, frequência e espelho)
 for(let n=9;n>=1;n--){
  [[101,201,P101],[102,202,P102],[103,n%2?203:204,floor30(now-4*H)]].forEach(([gid,sid,P],k)=>{
   if(gid===101&&n===4)return;   // uma falta no histórico
   const jIn=((n*7+gid)%21)-6,jOut=((n*5+gid)%13)-4,start=P-n*24*H+jIn*M,end=P-n*24*H+12*H+jOut*M;
   if(end>now-20*M)return;
   const sh=shift(gid,sid,start,end),i=n*3+k,rule=D.rules[sid];
   rec(sh,'Entrada',start,{location:loc(i),...(n<=2?ph('Entrada • '+sh.siteName,150):{})});
   if(n<=2)for(let c=1;c<=24;c++){const iv=rule.interval*M;if(start+c*iv<end-iv/2)rec(sh,'Checagem',start+c*iv+((c*3)%5)*M,{location:rule.gps?loc(i+c):null,text:c%4===0?'Perímetro e portões verificados, sem alterações.':'',...(c%3===0?ph('Checagem '+c,170):{})})}
   if(n===2&&gid===103)occ(sh,'Ocorrência',start+5*H,'Lâmpada queimada no corredor B. Supervisão informada para reposição.','resolvida',[{at:new Date(start+6*H).toISOString(),by:'Supervisão',action:'Nova → Resolvida',note:'Manutenção do condomínio trocou a lâmpada no mesmo turno.'}],{...ph('Corredor B • iluminação',40),location:loc(i)});
   rec(sh,'Saída',end,{location:loc(i+1)});sh.draft='Plantão encerrado sem ocorrência crítica. Posto entregue conforme procedimento.';
  });
 }
 // evento informado pelo vigilante (local aguarda revisão)
 {const sh=shift(105,205,now-30*H,now-19*H);rec(sh,'Entrada',now-30*H,{location:loc(40),...ph('Entrada • Evento',200)});occ(sh,'Passagem de serviço',now-19.2*H,'Evento encerrado. Equipamentos conferidos e pendências repassadas.','info',[],{location:loc(41)});rec(sh,'Saída',now-19*H,{location:loc(41)});sh.draft='Evento concluído sem intercorrências.'}
 // plantões em andamento
 {const st=P101+2*M,sh=shift(101,201,st);rec(sh,'Entrada',st,{location:loc(1),...ph('Entrada • Parque Norte',150)});[240,180,120,55].forEach((m,i)=>rec(sh,'Checagem',now-m*M,{location:loc(2+i),text:i===1?'Portão de serviço conferido; interfone testado.':'',...(i%2===0?ph('Checagem • acesso principal',160):{})}));
  occ(sh,'Observação',now-3.5*H,'Ronda realizada nos acessos principais. Portões, iluminação e perímetro sem anormalidades.','info',[],{location:loc(3)})}
 {const st=P102+14*M,sh=shift(102,202,st);rec(sh,'Entrada',st,{location:loc(8),...ph('Entrada • Orion',190)});[150,120,90,60,30,12].filter(m=>now-m*M>st).forEach((m,i)=>rec(sh,'Checagem',now-m*M,{location:loc(9+i)}));
  occ(sh,'Alteração no posto',now-35*M,'Portão da garagem com falha no fechamento automático. Mantido fechado manualmente; necessário acionar a manutenção.','nova',[],{...ph('Garagem • portão',30),location:loc(15)})}
 {const st=now-4*H,sh=shift(103,203,st);rec(sh,'Entrada',st,{...ph('Entrada • Jardim das Águas',130)});[180,140].forEach(m=>rec(sh,'Checagem',now-m*M,{...ph('Checagem • depósito',120)}));
  occ(sh,'Ocorrência',now-2*H,'Fumaça observada próxima à área externa do depósito. Supervisão comunicada e área isolada preventivamente.','andamento',[{at:new Date(now-1.8*H).toISOString(),by:'Supervisão',action:'Nova → Em andamento',note:'Supervisor de área a caminho; brigada do condomínio acionada.'}],{...ph('Área externa • fumaça',210)})}
 {const st=now-1.5*H,sh=shift(104,204,st);rec(sh,'Entrada',st,{location:loc(20),...ph('Entrada • Depósito Alfa',100)});
  const t=now-6*M;D.occurrences.push({...base(sh,'SOS',t,{text:'ALERTA SOS acionado pelo vigilante.',location:loc(21),status:'nova',history:[{at:new Date(t).toISOString(),by:sh.guardName,action:'SOS acionado'}]})});sh.events.push(D.occurrences[D.occurrences.length-1].id)}
 D.extraRequests=[{id:uid(),guardId:106,guardName:'André Lima',siteId:201,siteName:si(201).name,date:dayKey(now),start:'18:00',end:'06:00',reason:'Cobertura de falta autorizada pelo supervisor (exemplo fictício).',status:'Pendente',requestedAt:new Date(now-2*H).toISOString()}];
 D.audit=[{id:uid(),at:new Date(now-26*H).toISOString(),action:'Regra de checagem alterada',siteName:si(202).name,reason:'30 min, tolerância 5 min',author:'Supervisão'}];
 return D;
}

/* Migra, em segundo plano, fotos antigas (base64 dentro do localStorage) para o IndexedDB. */
(async()=>{
 try{
  const snap=demoMode?loadDb(false):db,map=new Map();
  for(const e of [...snap.records,...snap.occurrences])for(const u of e.photos){
   if(String(u).startsWith('data:')&&!map.has(u)){const ref=await Photos.put(dataUrlToBlob(u),u);if(!ref.startsWith('data:'))map.set(u,ref)}
  }
  if(!map.size)return;
  const fresh=loadDb(false);   // relê o armazenamento: nada salvo enquanto migrava é perdido
  [...fresh.records,...fresh.occurrences].forEach(e=>{e.photos=e.photos.map(p=>map.get(p)||p)});
  lsSet(REAL_KEY,JSON.stringify(fresh));if(user&&!demoMode)syncFromStorage();
  toast('Fotos antigas foram movidas para o armazenamento de imagens, liberando espaço.');
 }catch(e){console.warn('Migração de fotos adiada',e)}
})();
